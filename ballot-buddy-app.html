<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">

<script>window.va=window.va||function(){(window.vaq=window.vaq||[]).push(arguments)};</script>
<script defer src="/_vercel/insights/script.js"></script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;900&family=Public+Sans:ital,wght@0,400;0,600;0,700;1,400&display=swap">
<style>
  :root{
    --navy:#0F4A6B; --navy-deep:#0B3A55; --red:#D8454F; --red-deep:#B8353E; --coral:#D9737D;
    --cream:#F6F1E7; --cream-2:#EFE7D8; --marigold:#F2A65A; --ink:#0B1F2E; --ink-2:#3B4C58; --muted:#6B7C87;
    --line:#DCD2C0; --white:#FFFFFF; --good:#2E8B57; --warn:#C7791B;
    --display:'Archivo','Arial Narrow',Arial,sans-serif; --body:'Public Sans','Helvetica Neue',Arial,sans-serif;
  }

  *{box-sizing:border-box}
  body{margin:0;background:var(--cream-2);color:var(--ink);font-family:var(--body)}
  /* App shell: one full-height column, centered on wide screens, edge-to-edge on phones */
  .app{height:100vh;height:100dvh;display:flex;justify-content:center;overflow:hidden}
  .screen{width:100%;max-width:520px;height:100%;background:var(--cream);display:flex;flex-direction:column;position:relative;overflow:hidden;box-shadow:0 0 0 1px var(--line);padding-top:env(safe-area-inset-top)}
  .view{flex:1;overflow-y:auto;overflow-x:hidden;padding:12px 20px 24px;scroll-behavior:smooth}
  .view::-webkit-scrollbar{width:0}
  /* motion: screen changes fade in gently (class re-applied by go()) */
  @keyframes view-in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  @keyframes fade-in{from{opacity:0}to{opacity:1}}
  .view.enter{animation:view-in .32s ease-out}
  .tabs{display:flex;border-top:1px solid var(--line);background:var(--cream);padding:8px 6px 18px}
  .tab{flex:1;background:none;border:0;font:inherit;font-size:.66rem;font-weight:700;color:var(--navy);display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;padding:6px 0;border-radius:12px;transition:color .2s,transform .18s}
  .tab:active{transform:scale(.94)}
  .tab svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .tab.active{color:var(--red)}
  .tab:focus-visible{outline:2px solid var(--marigold)}

  h1.brand{font-family:var(--display);font-weight:900;color:var(--navy);text-align:center;font-size:2.1rem;line-height:1.05;margin:120px 0 14px;letter-spacing:-.01em}
  h1.brand small{display:block;font-weight:700;font-size:1.35rem;letter-spacing:0}
  h2{font-family:var(--display);font-weight:900;color:var(--navy);font-size:1.5rem;margin:8px 0 4px;line-height:1.1;letter-spacing:-.01em;text-wrap:balance}
  h3{font-family:var(--display);font-weight:700;font-size:1.05rem;margin:0 0 4px;color:var(--ink)}
  p{line-height:1.5;margin:0 0 10px}
  .sub{color:var(--muted);font-size:.85rem;margin-bottom:14px}
  .eyebrow{font-size:.68rem;letter-spacing:.14em;text-transform:uppercase;font-weight:700;color:var(--red);margin:14px 0 6px}
  .tagline{text-align:center;color:var(--ink-2);font-size:1rem;line-height:1.5;margin:0 auto 28px;max-width:26ch}
  a.src{color:var(--navy);font-weight:700;font-size:.82rem;text-decoration:none;border-bottom:1px solid var(--line)}
  a.src:hover{border-color:var(--navy)}
  .links{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
  .links a{font-size:.78rem;font-weight:700;color:var(--navy);text-decoration:none;background:var(--cream-2);padding:6px 10px;border-radius:999px}

  .btn{display:flex;align-items:center;gap:12px;width:100%;border:0;border-radius:12px;padding:15px 16px;font:inherit;font-weight:700;font-size:1.02rem;color:#fff;background:var(--red);cursor:pointer;text-align:left;margin-bottom:12px;box-shadow:0 2px 0 var(--red-deep)}
  .btn.navy{background:var(--navy);box-shadow:0 2px 0 var(--navy-deep)}
  .btn.center{justify-content:center}
  .btn.ghost{background:transparent;color:var(--navy);box-shadow:inset 0 0 0 2px var(--navy)}
  .btn.small{padding:10px 14px;font-size:.9rem;width:auto;display:inline-flex;margin:0}
  .btn svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
  .btn{transition:transform .18s,opacity .2s}
  .btn:active{transform:translateY(1px)}
  .btn:focus-visible,.card:focus-visible,input:focus-visible,select:focus-visible,.chip:focus-visible,summary:focus-visible,.pillbtn:focus-visible,.follow:focus-visible{outline:3px solid var(--marigold);outline-offset:2px}
  .btn:disabled{opacity:.5;cursor:not-allowed}
  .card svg{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

  .card{background:#fff;border-radius:16px;padding:14px 16px;margin-bottom:12px;border:1px solid var(--line);box-shadow:0 1px 2px rgba(11,31,46,.06)}
  .card.navy{background:var(--navy);color:#fff;border-color:transparent}
  .card.navy h3,.card.navy .sub{color:#fff}
  .card.navy .sub{opacity:.8}
  .card.note{background:var(--cream-2);border-color:transparent;box-shadow:none;font-size:.88rem;color:var(--ink-2);line-height:1.45}
  .card.warn{background:#FDEBD3;border-color:transparent;box-shadow:none;font-size:.85rem;color:#6B3F0A;line-height:1.45}
  .card.click{cursor:pointer;transition:border-color .2s,transform .18s}
  .card.click:hover{border-color:var(--navy)}
  .card.click:active{transform:scale(.985)}
  .row{display:flex;align-items:center;gap:12px}
  .row.between{justify-content:space-between}
  .stack{display:flex;flex-direction:column;gap:10px}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}

  .pill{display:inline-block;font-size:.68rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:4px 8px;border-radius:999px;background:var(--cream-2);color:var(--ink-2)}
  .pill.navy{background:#DCEAF3;color:var(--navy)}
  .pill.gold{background:#FDEBD3;color:#8A5210}
  .pill.good{background:#DDF1E4;color:#1F6B41}
  .pill.marigold{background:var(--marigold);color:var(--ink)}
  .pill.live{background:#E6F0F7;color:var(--navy)}
  .pillbtn{border:0;font:inherit;cursor:pointer}
  .pillbtn,.seg button,.chip,.follow,.listen,.back{transition:background-color .2s,color .2s,border-color .2s,box-shadow .2s,transform .18s}
  .pillbtn:active,.seg button:active,.chip:active,.follow:active,.listen:active{transform:scale(.96)}
  .back:active{transform:translateX(-1px)}

  .num{font-family:var(--display);font-weight:900;font-size:2.4rem;line-height:1;color:var(--navy);font-variant-numeric:tabular-nums}
  .countdown{display:flex;gap:8px;align-items:baseline}
  .countdown .lbl{font-size:.75rem;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.08em}

  .avatar{width:44px;height:44px;border-radius:50%;background:var(--navy);color:#fff;font-family:var(--display);font-weight:900;display:flex;align-items:center;justify-content:center;flex:none;font-size:1rem}
  .avatar.b{background:var(--coral)} .avatar.c{background:var(--marigold);color:var(--ink)} .avatar.d{background:#5C7F93}

  .back{background:none;border:0;font:inherit;font-weight:700;color:var(--navy);cursor:pointer;padding:6px 0;display:inline-flex;align-items:center;gap:6px;margin-bottom:6px}
  .back svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2.5;stroke-linecap:round}

  label.f{display:block;font-size:.78rem;font-weight:700;color:var(--ink-2);margin:12px 0 6px;letter-spacing:.02em}
  input[type=text],input[type=tel],select{width:100%;font:inherit;font-size:1.05rem;padding:12px 14px;border-radius:12px;border:2px solid var(--line);background:#fff;color:var(--ink)}
  input[type=text],input[type=tel],select{transition:border-color .2s}
  input[type=text]:focus,input[type=tel]:focus{border-color:var(--navy)}
  a.src,.links a{transition:border-color .2s,background-color .2s}
  .seg{display:flex;background:var(--cream-2);border-radius:12px;padding:4px;gap:4px}
  .seg button{flex:1;border:0;background:transparent;font:inherit;font-weight:700;font-size:.85rem;padding:8px;border-radius:9px;color:var(--ink-2);cursor:pointer}
  .seg button.on{background:#fff;color:var(--navy);box-shadow:0 1px 3px rgba(0,0,0,.12)}
  .chips{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 12px}
  .chip{border:2px solid var(--line);background:#fff;border-radius:999px;padding:7px 12px;font:inherit;font-size:.82rem;font-weight:700;color:var(--ink-2);cursor:pointer}
  .chip.on{border-color:var(--navy);background:var(--navy);color:#fff}

  .toggle{position:relative;width:46px;height:26px;border-radius:999px;background:#C9C0AE;border:0;cursor:pointer;flex:none;padding:0;transition:background-color .2s}
  .toggle::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:left .2s ease-out}
  .toggle.on{background:var(--good)} .toggle.on::after{left:23px}
  @media (prefers-reduced-motion:reduce){
    .toggle::after{transition:none} .view{scroll-behavior:auto} .swipe-card{transition:none!important}
    *,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important}
  }

  .follow{border:2px solid var(--navy);background:#fff;color:var(--navy);border-radius:999px;font:inherit;font-weight:700;font-size:.78rem;padding:6px 12px;cursor:pointer;flex:none}
  .follow.on{background:var(--navy);color:#fff}

  details.legal-d{margin-top:14px;border-top:1px solid var(--line);padding-top:10px}
  details.legal-d summary{cursor:pointer;font-weight:700;color:var(--navy);font-size:.9rem;list-style:none;display:flex;justify-content:space-between}
  details.legal-d summary::-webkit-details-marker{display:none}
  details.legal-d summary::after{content:"+";font-weight:900}
  details.legal-d[open] summary::after{content:"–"}
  details.legal-d[open] > :not(summary){animation:fade-in .25s ease-out}
  .legal{font-size:.8rem;line-height:1.55;color:var(--ink-2);background:var(--cream-2);border-left:3px solid var(--line);padding:10px 12px;border-radius:0 10px 10px 0;font-style:italic;margin-top:10px}
  ul.simple,ol.simple{margin:6px 0 10px;padding-left:20px;line-height:1.5;font-size:1.02rem}
  ul.simple li,ol.simple li{margin-bottom:8px}
  .yesno{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:10px 0}
  .yesno div{border-radius:12px;padding:10px 12px;font-size:.85rem;line-height:1.45}
  .yesno .y{background:#DDF1E4} .yesno .n{background:#FBE3E5}
  .yesno b{display:block;font-family:var(--display);font-size:1rem;margin-bottom:4px}

  table.cmp{width:100%;border-collapse:collapse;font-size:.85rem}
  table.cmp th,table.cmp td{border-bottom:1px solid var(--line);padding:8px 6px;text-align:left;vertical-align:top;line-height:1.4;min-width:120px}
  table.cmp th:first-child,table.cmp td:first-child{min-width:80px}
  table.cmp th{font-family:var(--display);font-weight:700;color:var(--navy)}
  .scrollx{overflow-x:auto}

  .timeline{position:relative;padding-left:26px;margin-top:10px}
  .timeline::before{content:"";position:absolute;left:8px;top:8px;bottom:8px;width:2px;background:var(--line)}
  .tl{position:relative;margin-bottom:18px}
  .tl::before{content:"";position:absolute;left:-23px;top:6px;width:12px;height:12px;border-radius:50%;background:var(--navy);border:2px solid var(--cream)}
  .tl.hot::before{background:var(--red)}
  .tl .d{font-weight:700;font-variant-numeric:tabular-nums;color:var(--navy);font-size:.85rem}
  .tl .t{font-weight:700;font-size:1.05rem}
  .tl .s{font-size:.85rem;color:var(--ink-2);line-height:1.4}

  /* swipe matcher */
  .deck{position:relative;height:300px;margin:10px 0 14px}
  .swipe-card{position:absolute;inset:0;background:#fff;border:1px solid var(--line);border-radius:20px;padding:22px 20px;display:flex;flex-direction:column;justify-content:space-between;box-shadow:0 10px 30px rgba(11,31,46,.12);transition:transform .25s,opacity .25s;touch-action:pan-y;user-select:none}
  .swipe-card.behind{transform:scale(.95) translateY(12px);opacity:.6;z-index:0}
  .swipe-card.top{z-index:2;cursor:grab;animation:card-up .28s ease-out}
  @keyframes card-up{from{transform:scale(.95) translateY(12px)}to{transform:none}}
  .swipe-card .q{font-family:var(--display);font-weight:700;font-size:1.25rem;line-height:1.3;color:var(--ink);margin:10px 0}
  .swipe-card .who{font-size:.8rem;color:var(--muted);font-weight:700}
  .swipe-card .stamp{position:absolute;top:18px;font-family:var(--display);font-weight:900;font-size:1.4rem;padding:4px 12px;border:3px solid;border-radius:10px;opacity:0;transform:rotate(-12deg)}
  .swipe-card .stamp.yes{right:18px;color:var(--good);border-color:var(--good)}
  .swipe-card .stamp.no{left:18px;color:var(--red);border-color:var(--red);transform:rotate(12deg)}
  .swipe-card.vote-card{border-left:5px solid var(--marigold)}
  .swipe-card.vote-card .q{font-size:1.08rem}
  .swipe-actions{display:grid;grid-template-columns:1fr auto 1fr;gap:10px}
  .swipe-actions .btn{margin:0}
  .bar{height:10px;background:var(--cream-2);border-radius:999px;overflow:hidden;margin:6px 0 4px}
  .bar i{display:block;height:100%;background:var(--navy);border-radius:999px}

  .vote{border-top:1px solid var(--line);padding:10px 0}
  .vote:first-child{border-top:0}
  .vote .d{font-size:.72rem;color:var(--muted);font-weight:700;letter-spacing:.06em;text-transform:uppercase}
  .vote .t{font-weight:700;margin:2px 0}
  .vote .s{font-size:.85rem;color:var(--ink-2);line-height:1.4}
  .vote .v{display:inline-block;font-size:.72rem;font-weight:700;padding:3px 8px;border-radius:999px;margin-top:6px}
  .vote .v.yea{background:#DDF1E4;color:#1F6B41} .vote .v.nay{background:#FBE3E5;color:var(--red-deep)} .vote .v.nv{background:var(--cream-2);color:var(--ink-2)}

  .chat{display:flex;flex-direction:column;gap:10px;padding-bottom:8px}
  .msg{max-width:85%;padding:10px 13px;border-radius:16px;font-size:.95rem;line-height:1.45;white-space:pre-wrap}
  .msg.bot{background:#fff;border:1px solid var(--line);border-bottom-left-radius:4px;align-self:flex-start}
  .msg.me{background:var(--navy);color:#fff;border-bottom-right-radius:4px;align-self:flex-end}
  .chat .msg:last-child{animation:view-in .25s ease-out}
  .chatbar{display:flex;gap:8px;position:sticky;bottom:0;background:var(--cream);padding-top:8px}
  .chatbar input{flex:1}
  .chatbar .btn{width:auto;margin:0;padding:12px 14px}
  .suggest{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}

  .listen{background:none;border:2px solid var(--navy);color:var(--navy);border-radius:999px;font:inherit;font-weight:700;font-size:.78rem;padding:6px 12px;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
  .listen svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
  .listen.on{background:var(--navy);color:#fff}

  .feed .card{border-left:4px solid var(--navy)}
  .feed .card.alert{border-left-color:var(--red)}
  .feed time{font-size:.72rem;color:var(--muted);font-weight:700;letter-spacing:.06em;text-transform:uppercase}

  .mascot{position:absolute;right:16px;bottom:92px;width:58px;height:58px;border-radius:50%;border:0;padding:0;cursor:pointer;background:linear-gradient(160deg,var(--navy),var(--navy-deep));box-shadow:0 8px 20px rgba(11,31,46,.35),inset 0 0 0 3px rgba(255,255,255,.14);display:flex;align-items:center;justify-content:center;z-index:7;transition:transform .18s}
  .mascot svg{width:36px;height:36px}
  .mascot:active{transform:scale(.92)}
  .mascot:focus-visible{outline:3px solid var(--marigold);outline-offset:3px}
  .mascot .pole{stroke:var(--cream)}
  .mascot-badge .pole{stroke:var(--navy)}
  .mascot-badge{display:inline-flex;width:28px;height:28px}
  .mascot-badge svg{width:100%;height:100%}

  .toast{position:absolute;left:20px;right:20px;bottom:96px;background:var(--ink);color:#fff;padding:12px 14px;border-radius:12px;font-size:.88rem;font-weight:600;opacity:0;transform:translateY(8px);transition:opacity .22s ease-out,transform .22s ease-out;pointer-events:none;z-index:9;text-align:center}
  .toast.show{opacity:1;transform:none}
  .sheet-bg{position:absolute;inset:0;background:rgba(11,31,46,.5);z-index:8;display:none}
  .sheet-bg.show{display:block;animation:fade-in .3s ease-out}
  .sheet-bg.show.hide{animation:fade-in .24s ease-in reverse forwards}
  .sheet{position:absolute;left:0;right:0;bottom:0;background:var(--cream);border-radius:28px 28px 0 0;padding:20px 22px 34px;z-index:10;display:none;max-height:80%;overflow-y:auto}
  .sheet.show{display:block;animation:sheet-in .32s ease-out}
  .sheet.show.hide{animation:sheet-in .24s ease-in reverse forwards}
  @keyframes sheet-in{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
  .sheet .price{font-family:var(--display);font-weight:900;font-size:2.2rem;color:var(--navy)}
  .sheet .price small{font-size:1rem;font-weight:700;color:var(--muted)}
  .sheet ul{padding-left:18px;line-height:1.5;font-size:.9rem;margin:8px 0 14px}
  .sheet ul li{margin-bottom:8px}
  .view.large{font-size:1.12rem}
  .view.large .card{padding:16px 18px}

  @media (max-width:820px){
    body{background:var(--cream)}
    .screen{max-width:none;box-shadow:none}
    .tabs{padding-bottom:calc(18px + env(safe-area-inset-bottom))}
    .toast{bottom:calc(96px + env(safe-area-inset-bottom))}
    .sheet{padding-bottom:calc(34px + env(safe-area-inset-bottom))}
    .mascot{width:64px;height:64px;right:18px;bottom:calc(96px + env(safe-area-inset-bottom))}
    .mascot svg{width:40px;height:40px}

    /* Home: fill the viewport with a bigger, more touch-friendly layout */
    .view.home-view{display:flex;flex-direction:column;padding:16px 18px 96px;font-size:1.05rem}
    .view.home-view > *{flex:none}
    .view.home-view .grid2{flex:1 0 auto;grid-auto-rows:minmax(120px,1fr);margin-bottom:12px}
    .view.home-view h1.brand{margin:60px 0 14px;font-size:2.4rem}
    .view.home-view h2{font-size:1.85rem}
    .view.home-view .sub{font-size:.95rem}
    .view.home-view .card{padding:18px 20px;border-radius:20px}
    .view.home-view .card.navy{padding:22px 20px}
    .view.home-view .card.navy .num{font-size:3rem}
    .view.home-view .grid2{gap:12px}
    .view.home-view .grid2 .card{padding:22px 16px;margin:0}
    .view.home-view .grid2 .card h3{font-size:1.15rem}
    .view.home-view .btn{padding:19px 18px;font-size:1.12rem;min-height:58px;border-radius:16px}
    .view.home-view .chip{padding:10px 16px;font-size:.92rem}
  }
  .race{margin-bottom:4px}   .race h3.race-t{margin:0 0 2px;font-size:1rem}   .meta{margin:0 0 8px;font-size:.8rem}
  details.odesc{margin:0 0 10px;padding:0}   details.odesc summary{cursor:pointer;font-weight:700;color:var(--navy);font-size:.82rem;list-style:none}   details.odesc summary::-webkit-details-marker{display:none}   details.odesc summary::before{content:'ⓘ ';}   details.odesc p{margin:6px 0 4px;font-size:.9rem;color:var(--ink-2);line-height:1.45}
  .kind{display:inline-block;font-size:.64rem;letter-spacing:.08em;text-transform:uppercase;font-weight:700;padding:2px 7px;border-radius:999px;margin:0 6px 4px 0;background:var(--cream-2);color:var(--ink-2)}   .kind.record{background:#E3EEF5;color:var(--navy)}   .kind.reporting{background:#FDEBD3;color:#6B3F0A}
  .eyebrow.muted{color:var(--muted)}   .pill.muted{background:var(--cream-2);color:var(--ink-2)}   input[type=search]{font:inherit;padding:10px 12px;border:2px solid var(--line);border-radius:12px;background:#fff}
</style>

<div class="app">
  <div class="screen">
    <div class="view" id="view" aria-live="polite"></div>
    <nav class="tabs" id="tabs" aria-label="Main">
      <button class="tab" data-tab="home" onclick="go('home')">

26","es":"Asambleísta estatal, Distrito 26"},"office_key":"assembly"}}},"measures":{"CA":[{"number":"Prop 1","title":{"en":"Housing Bond","es":"Bono para vivienda"},"ballot_label":"Authorizes $11.25 billion in state general obligation bonds for housing affordability programs, including multifamily rental housing, mortgages for veterans, supportive housing, preservation of existing affordable housing, and downpayment assistance.","plain":{"en":["Lets the state borrow $11.25 billion by selling bonds.","Pays for rental housing, veterans’ home loans, supportive housing, and down-payment help.","The state pays it back over about 25 years."],"es":["Permite al estado pedir prestados $11.25 mil millones vendiendo bonos.","Paga vivienda de renta, préstamos para veteranos, vivienda de apoyo y ayuda para el enganche.","El estado lo paga en unos 25 años."]},"yes":{"en":"The state could borrow $11.25 billion for veterans and affordable housing.","es":"El estado podría pedir prestados $11.25 mil millones para veteranos y vivienda asequible."},"no":{"en":"The state could not borrow that money.","es":"El estado no podría pedir ese préstamo."},"fiscal":{"en":"About $500–600 million a year for about 25 years.","es":"Unos $500–600 millones al año por unos 25 años."},"urls":["https://voterguide.sos.ca.gov/propositions/1/"]},{"number":"Prop 2","title":{"en":"Bigger Rainy Day Fund","es":"Fondo de reserva más grande"},"ballot_label":"Increases California’s Rainy Day Fund, approved by voters in 2014, to provide funding for education, health care, public safety, and other essential services during economic downturns.","plain":{"en":["Makes the state’s savings account (the Rainy Day Fund) bigger: the cap rises from 10% to 20% of tax revenue.","Extends the state’s extra debt payments through 2040 instead of 2030.","The savings help keep schools, health care, and public safety funded when the economy is bad."],"es":["Hace más grande la cuenta de ahorros del estado (Fondo de reserva): el tope sube del 10% al 20% de los ingresos.","Extiende los pagos extra de deuda hasta 2040 en vez de 2030.","Los ahorros ayudan a mantener escuelas, salud y seguridad cuando la economía va mal."]},"yes":{"en":"State reserves would be higher; extra debt payments continue longer.","es":"Las reservas serían mayores; los pagos extra de deuda durarían más."},"no":{"en":"Reserve and debt-payment rules stay the same.","es":"Las reglas de reserva y pago de deuda siguen igual."},"fiscal":{"en":"State budget reserves would be higher.","es":"Las reservas del presupuesto estatal serían mayores."},"urls":["https://voterguide.sos.ca.gov/propositions/2/"]},{"number":"Prop 3","title":{"en":"Keep High-Income Tax for Schools","es":"Mantener impuesto a altos ingresos para escuelas"},"ballot_label":"Makes permanent existing voter-approved tax rates for individuals earning over $371,000 (adjusted annually for inflation). Allocates tax revenues to public education.","plain":{"en":["Keeps today’s higher income tax rates on people earning over $371,000 instead of ending them in 2031.","The money goes to public education and other programs.","The state keeps $5–15 billion a year it would otherwise lose."],"es":["Mantiene las tasas más altas de impuesto a quienes ganan más de $371,000 en vez de terminarlas en 2031.","El dinero va a educación pública y otros programas.","El estado conserva $5–15 mil millones al año que perdería."]},"yes":{"en":"The 2012 tax increase on high earners becomes permanent.","es":"El aumento de impuestos de 2012 a altos ingresos se vuelve permanente."},"no":{"en":"It expires in 2031.","es":"Termina en 2031."},"fiscal":{"en":"Keeps $5–15 billion a year in state revenue.","es":"Conserva $5–15 mil millones al año de ingresos estatales."},"urls":["https://voterguide.sos.ca.gov/propositions/3/"]},{"number":"Prop 4","title":{"en":"Public Campaign Funding","es":"Financiamiento público de campañas"},"ballot_label":"Repeals prohibition on state and local governments offering public funding of candidate election campaigns. Public funding programs may not use funds earmarked for education, transportation, or public safety.","plain":{"en":["Removes the ban on governments using public money for candidates’ campaigns.","State and local governments could choose to create public campaign funding programs, with limits.","Money set aside for education, transportation, or public safety could not be used."],"es":["Elimina la prohibición de usar dinero público en campañas de candidatos.","Los gobiernos estatal y locales podrían crear programas de financiamiento público, con límites.","No se podría usar dinero reservado para educación, transporte o seguridad."]},"yes":{"en":"Governments could create public campaign financing programs.","es":"Los gobiernos podrían crear programas de financiamiento público de campañas."},"no":{"en":"They remain unable to.","es":"Seguirían sin poder hacerlo."},"fiscal":{"en":"A few hundred thousand dollars a year for the state.","es":"Unos cientos de miles de dólares al año para el estado."},"urls":["https://voterguide.sos.ca.gov/propositions/4/"]},{"number":"Prop 5","title":{"en":"Change the Recall Process","es":"Cambiar el proceso de destitución"},"ballot_label":"Under current law, voters elect replacement candidates at the same time as the recall election. This measure instead fills recall vacancies by subsequent special election or appointment.","plain":{"en":["Changes what happens when a statewide officer, like the Governor, is recalled.","The recall ballot would only ask whether to remove them, not who replaces them.","The seat would be filled later by a special election or an appointment."],"es":["Cambia lo que pasa cuando se destituye a un funcionario estatal, como el Gobernador.","La boleta solo preguntaría si removerlo, no quién lo reemplaza.","El puesto se llenaría después por elección especial o nombramiento."]},"yes":{"en":"Recall ballots no longer pick a replacement; vacancies are filled by special election or appointment.","es":"Las boletas de destitución ya no eligen reemplazo; las vacantes se llenan por elección especial o nombramiento."},"no":{"en":"Voters keep choosing the replacement on the recall ballot.","es":"Los votantes siguen eligiendo el reemplazo en la boleta."},"fiscal":{"en":"Unknown; savings or costs of millions if a recall happens.","es":"Desconocido; ahorros o costos de millones si hay una destitución."},"urls":["https://voterguide.sos.ca.gov/propositions/5/"]},{"number":"Prop 37","title":{"en":"Home Loans for Middle-Income Buyers","es":"Préstamos para compradores de ingresos medios"},"ballot_label":"Authorizes $25 billion in bonds to offer eligible buyers fixed-rate mortgages for up to 17% of purchase price of a newly constructed home priced below about $1.5 million.","plain":{"en":["Creates a state loan program for middle-income buyers of newly built homes under about $1.5 million.","The state could sell up to $25 billion in bonds; buyers get a fixed-rate loan for up to 17% of the price.","Homeowners’ loan payments pay the bonds back."],"es":["Crea un programa estatal de préstamos para compradores de ingresos medios de casas nuevas de menos de $1.5 millones.","El estado podría vender hasta $25 mil millones en bonos; el comprador recibe un préstamo fijo de hasta 17% del precio.","Los pagos de los propietarios devuelven los bonos."]},"yes":{"en":"The state creates the program and can sell up to $25 billion in bonds.","es":"El estado crea el programa y puede vender hasta $25 mil millones en bonos."},"no":{"en":"No new program.","es":"No hay programa nuevo."},"fiscal":{"en":"No direct state or local cost.","es":"Sin costo directo para el estado o los gobiernos locales."},"urls":["https://voterguide.sos.ca.gov/propositions/37/"]},{"number":"Prop 38","title":{"en":"Medical Research Bond","es":"Bono para investigación médica"},"ballot_label":"Authorizes $8.4 billion in general obligation bonds for immunology and immunotherapy research, half to a single University of California-affiliated nonprofit medical research institute, half to research grants.","plain":{"en":["Lets the state borrow $8.4 billion for immunology and immunotherapy research.","Half goes to one UC-affiliated research institute; half to research grants.","Paid back over about 20 years."],"es":["Permite al estado pedir prestados $8.4 mil millones para investigación en inmunología e inmunoterapia.","La mitad va a un instituto afiliado a la UC; la otra mitad a becas de investigación.","Se paga en unos 20 años."]},"yes":{"en":"The state can borrow $8.4 billion for this research.","es":"El estado puede pedir prestados $8.4 mil millones para esta investigación."},"no":{"en":"It cannot.","es":"No puede."},"fiscal":{"en":"$500–600 million a year for about 20 years, partly offset if the research earns money.","es":"$500–600 millones al año por unos 20 años, en parte compensado si la investigación genera ingresos."},"urls":["https://voterguide.sos.ca.gov/propositions/38/"]},{"number":"Prop 39","title":{"en":"Voter ID Requirement","es":"Requisito de identificación para votar"},"ballot_label":"Invalidates mail ballots that do not have last four digits of designated government-issued identification number written on envelope. Prohibits in-person voting without presenting government-issued identification.","plain":{"en":["Requires a government-issued ID to vote in person.","Mail ballots would not count unless the last four digits of a government ID number are written on the envelope.","Today, your signature confirms your identity."],"es":["Exige identificación oficial para votar en persona.","Las boletas por correo no contarían sin los últimos cuatro dígitos de una identificación oficial en el sobre.","Hoy, tu firma confirma tu identidad."]},"yes":{"en":"Voters must show extra ID each time they vote.","es":"Los votantes deben mostrar identificación adicional cada vez que votan."},"no":{"en":"Your signature keeps confirming your identity.","es":"Tu firma sigue confirmando tu identidad."},"fiscal":{"en":"Tens of millions to low hundreds of millions of dollars a year.","es":"Decenas a cientos de millones de dólares al año."},"urls":["https://voterguide.sos.ca.gov/propositions/39/"]},{"number":"Prop 40","title":{"en":"One-Time Billionaire Tax","es":"Impuesto único a multimillonarios"},"ballot_label":"Imposes 5% tax on certain taxpayers with assets over $1 billion; revenue primarily for health care.","plain":{"en":["A one-time 5% tax on the wealth of people with assets over $1 billion.","Most of the money goes to health care.","The money is kept outside the usual school-funding and spending-limit rules."],"es":["Un impuesto único del 5% sobre la riqueza de quienes tienen más de $1 mil millones.","La mayor parte del dinero va a salud.","El dinero queda fuera de las reglas usuales de fondos escolares y límite de gasto."]},"yes":{"en":"The state collects a one-time 5% wealth tax from billionaires.","es":"El estado cobra un impuesto único del 5% a los multimillonarios."},"no":{"en":"No such tax.","es":"No hay ese impuesto."},"fiscal":{"en":"Tens of billions in one-time revenue, spread over several years.","es":"Decenas de miles de millones en ingresos únicos, repartidos en varios años."},"urls":["https://voterguide.sos.ca.gov/propositions/40/"]},{"number":"Prop 41","title":{"en":"Spending Limit & Tax Audits","es":"Límite de gasto y auditorías"},"ballot_label":"Nullifies state taxes enacted after January 1, 2026 that exempt their revenues from voter-approved state spending limit. Requires pre-election and recurring audits of programs funded by new special taxes.","plain":{"en":["Cancels any new state tax passed after Jan 1, 2026 that keeps its money outside the state spending limit.","The State Auditor must review the programs a new special tax would fund before it reaches the ballot.","Programs paid for by special taxes get regular audits."],"es":["Cancela cualquier impuesto estatal nuevo posterior al 1 de enero de 2026 que quede fuera del límite de gasto.","El Auditor Estatal debe revisar los programas de un impuesto especial nuevo antes de la votación.","Los programas pagados con impuestos especiales tendrían auditorías regulares."]},"yes":{"en":"New audits are required; new special taxes can’t be excluded from the spending limit.","es":"Se exigen auditorías nuevas; los impuestos especiales nuevos no pueden excluirse del límite de gasto."},"no":{"en":"Audit and spending-limit rules stay as they are.","es":"Las reglas de auditoría y límite de gasto siguen igual."},"fiscal":{"en":"Unknown; depends on future decisions.","es":"Desconocido; depende de decisiones futuras."},"urls":["https://voterguide.sos.ca.gov/propositions/41/"]},{"number":"Prop 42","title":{"en":"Ban New Personal Property Taxes","es":"Prohibir nuevos impuestos a bienes personales"},"ballot_label":"Prohibits any new state tax (1) imposed on the ownership of personal property (all things people own other than real estate), or (2) that applies retroactively based on taxpayer’s past activities.","plain":{"en":["Bans new state taxes on simply owning personal property, such as financial assets.","Bans new state taxes that reach back to past years.","Any conflicting tax passed after Jan 1, 2026 is cancelled."],"es":["Prohíbe nuevos impuestos estatales por solo poseer bienes personales, como activos financieros.","Prohíbe nuevos impuestos estatales retroactivos.","Cualquier impuesto en conflicto aprobado después del 1 de enero de 2026 se cancela."]},"yes":{"en":"The state can’t create new taxes on owning financial assets or other personal property.","es":"El estado no puede crear nuevos impuestos por poseer activos financieros u otros bienes personales."},"no":{"en":"The state keeps that option.","es":"El estado conserva esa opción."},"fiscal":{"en":"Future tax revenue might grow less.","es":"Los ingresos futuros podrían crecer menos."},"urls":["https://voterguide.sos.ca.gov/propositions/42/"]},{"number":"Prop 43","title":{"en":"Two-Thirds Vote for Local Taxes","es":"Dos tercios para impuestos locales"},"ballot_label":"Limits voters’ ability to pass voter-proposed local special taxes by increasing percentage of votes needed to approve such ballot measures from a majority (over 50%) to two-thirds, beginning January 1, 2027.","plain":{"en":["Raises the vote needed to pass voter-proposed local special taxes from a majority to two-thirds.","Applies to new, increased, or extended local special taxes starting Jan 1, 2027.","Some local taxes would be harder to pass."],"es":["Sube de mayoría a dos tercios el voto necesario para impuestos locales especiales propuestos por votantes.","Aplica a impuestos locales especiales nuevos, aumentados o extendidos desde el 1 de enero de 2027.","Algunos impuestos locales serían más difíciles de aprobar."]},"yes":{"en":"Certain local taxes need two-thirds voter approval.","es":"Ciertos impuestos locales necesitan dos tercios de los votos."},"no":{"en":"A majority is still enough.","es":"Una mayoría sigue siendo suficiente."},"fiscal":{"en":"Local tax revenue might grow less.","es":"Los ingresos locales podrían crecer menos."},"urls":["https://voterguide.sos.ca.gov/propositions/43/"]},{"number":"Prop 44","title":{"en":"Community Clinic Spending Rule","es":"Regla de gasto para clínicas comunitarias"},"ballot_label":"Imposes penalties on nonprofit Federally Qualified Health Centers (community clinics providing primary care to medically underserved areas and populations) that spend less than 90% of revenue on “program services” advancing their charitable purpose, including but not limited to patient services.","plain":{"en":["Requires nonprofit community health clinics to spend at least 90% of revenue on program services, including patient care.","Clinics that fall short face penalties.","The state’s new costs are covered by fees."],"es":["Exige que las clínicas comunitarias sin fines de lucro gasten al menos 90% de sus ingresos en servicios, incluida la atención a pacientes.","Las clínicas que no cumplan tendrían sanciones.","Los nuevos costos del estado se cubren con cuotas."]},"yes":{"en":"Certain nonprofit clinics must spend 90% of revenue on services.","es":"Ciertas clínicas sin fines de lucro deben gastar 90% de sus ingresos en servicios."},"no":{"en":"No new requirement.","es":"No hay requisito nuevo."},"fiscal":{"en":"Low tens of millions a year for the state, covered by fees.","es":"Unas decenas de millones al año para el estado, cubiertas con cuotas."},"urls":["https://voterguide.sos.ca.gov/propositions/44/"]},{"number":"Prop 45","title":{"en":"Faster Environmental Review (CEQA)","es":"Revisión ambiental más rápida (CEQA)"},"ballot_label":"Amends California Environmental Quality Act (CEQA) to expedite environmental review for certain projects (including most housing, transportation, water, and health projects) by setting deadlines to complete environmental review and resolve lawsuits challenging project approvals.","plain":{"en":["Speeds up environmental review (CEQA) for most housing, transportation, water, and health projects.","Sets deadlines for finishing the review.","Sets deadlines for resolving lawsuits against project approvals."],"es":["Acelera la revisión ambiental (CEQA) de la mayoría de proyectos de vivienda, transporte, agua y salud.","Fija plazos para terminar la revisión.","Fija plazos para resolver demandas contra la aprobación de proyectos."]},"yes":{"en":"Eligible projects get new, faster review and court procedures.","es":"Los proyectos elegibles tendrían procedimientos de revisión y judiciales más rápidos."},"no":{"en":"Projects keep the current procedures.","es":"Los proyectos siguen con los procedimientos actuales."},"fiscal":{"en":"High tens of millions, possibly over $100 million, a year for governments.","es":"Decenas de millones, posiblemente más de $100 millones, al año para los gobiernos."},"urls":["https://voterguide.sos.ca.gov/propositions/45/"]}]},"local":{},"deadlines":{"CA":[{"id":"mail","date":"
