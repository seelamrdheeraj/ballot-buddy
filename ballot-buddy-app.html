e laws are carried out, proposes the state budget, can sign or veto bills from the Legislature, and appoints many state officials and judges to fill vacancies. Voters statewide elect the Governor, who can serve up to two terms.","es":"El Gobernador es el jefe del poder ejecutivo de California. Vela por que se cumplan las leyes estatales, propone el presupuesto del estado, puede firmar o vetar los proyectos de ley de la Legislatura y nombra a muchos funcionarios estatales y a jueces para cubrir vacantes. Los votantes de todo el estado lo eligen, y puede servir hasta dos períodos."},"term":"4 years","src":"https://admin.cdn.sos.ca.gov/ca-roster/2026/constitutional-officers.pdf","src_title":"California Roster 2026: Constitutional Officers (California Secretary of State)"},"lt_governor":{"title":{"en":"Lieutenant Governor","es":"Vicegobernador"},"desc":{"en":"The Lieutenant Governor becomes Governor if the Governor leaves office and acts as Governor when the Governor is out of state. The Lieutenant Governor also presides over the State Senate, voting only to break ties, and sits on several state boards, including the University of California Regents. Voters statewide elect this office.","es":"El Vicegobernador asume como Gobernador si este deja el cargo y actúa como Gobernador cuando el Gobernador está fuera del estado. También preside el Senado estatal, donde solo vota para romper empates, y forma parte de varias juntas estatales, como la Junta de Regentes de la Universidad de California. Los votantes de todo el estado eligen este cargo."},"term":"4 years","src":"https://admin.cdn.sos.ca.gov/ca-roster/2026/constitutional-officers.pdf","src_title":"California Roster 2026: Constitutional Officers (California Secretary of State)"},"secretary_of_state":{"title":{"en":"Secretary of State","es":"Secretario de Estado"},"desc":{"en":"The Secretary of State is California's chief elections officer. The office oversees and certifies elections, keeps the statewide voter registration database, and publishes the Voter Information Guide. It also keeps business filings, campaign and lobbying records, and the state archives. Voters statewide elect the Secretary of State.","es":"El Secretario de Estado es el principal funcionario electoral de California. La oficina supervisa y certifica las elecciones, mantiene la base de datos estatal de votantes registrados y publica la Guía de Información para el Votante. También guarda los registros de empresas, de campañas y de cabildeo, y los archivos del estado. Los votantes de todo el estado lo eligen."},"term":"4 years","src":"https://admin.cdn.sos.ca.gov/ca-roster/2026/constitutional-officers.pdf","src_title":"California Roster 2026: Constitutional Officers (California Secretary of State)"},"controller":{"title":{"en":"State Controller","es":"Contralor del Estado"},"desc":{"en":"The State Controller is California's chief fiscal officer. The Controller pays the state's bills and state employee payroll, audits claims against the state, reports on state and local government finances, and safeguards unclaimed property until owners claim it. Voters statewide elect the Controller.","es":"El Contralor del Estado es el principal funcionario fiscal de California. Paga las cuentas y la nómina de los empleados del estado, audita los reclamos contra el estado, informa sobre las finanzas de los gobiernos estatal y locales, y resguarda la propiedad no reclamada hasta que sus dueños la reclamen. Los votantes de todo el estado lo eligen."},"term":"4 years","src":"https://admin.cdn.sos.ca.gov/ca-roster/2026/constitutional-officers.pdf","src_title":"California Roster 2026: Constitutional Officers (California Secretary of State)"},"treasurer":{"title":{"en":"State Treasurer","es":"Tesorero del Estado"},"desc":{"en":"The State Treasurer is the state's banker and lead investor. The Treasurer invests state money, sells state bonds (including voter-approved bonds), and sits on the boards of the CalPERS and CalSTRS pension funds. Voters statewide elect the Treasurer.","es":"El Tesorero del Estado es el banquero y principal inversionista del estado. Invierte el dinero del estado, vende los bonos estatales (incluidos los aprobados por los votantes) y forma parte de las juntas de los fondos de pensiones CalPERS y CalSTRS. Los votantes de todo el estado lo eligen."},"term":"4 years","src":"https://admin.cdn.sos.ca.gov/ca-roster/2026/constitutional-officers.pdf","src_title":"California Roster 2026: Constitutional Officers (California Secretary of State)"},"attorney_general":{"title":{"en":"Attorney General","es":"Fiscal General"},"desc":{"en":"The Attorney General leads the California Department of Justice. The office enforces state laws, represents the people in civil and criminal court cases, serves as legal counsel to state officers and most state agencies, and assists local district attorneys and law enforcement. Voters statewide elect the Attorney General.","es":"El Fiscal General dirige el Departamento de Justicia de California. La oficina hace cumplir las leyes estatales, representa al pueblo en casos civiles y penales ante los tribunales, sirve como asesor legal de los funcionarios y de la mayoría de las agencias del estado, y ayuda a los fiscales de distrito y a las fuerzas del orden locales. Los votantes de todo el estado lo eligen."},"term":"4 years","src":"https://admin.cdn.sos.ca.gov/ca-roster/2026/constitutional-officers.pdf","src_title":"California Roster 2026: Constitutional Officers (California Secretary of State)"},"insurance_commissioner":{"title":{"en":"Insurance Commissioner","es":"Comisionado de Seguros"},"desc":{"en":"The Insurance Commissioner leads the California Department of Insurance. The Commissioner regulates the insurance industry, regulates rates for auto, home, and other property and casualty insurance, licenses insurance agents and brokers, and handles consumer complaints. Voters statewide elect the Commissioner.","es":"El Comisionado de Seguros dirige el Departamento de Seguros de California. Regula la industria de seguros, regula las tarifas de los seguros de automóvil, de vivienda y otros seguros de propiedad y responsabilidad, otorga licencias a agentes y corredores de seguros y atiende las quejas de los consumidores. Los votantes de todo el estado lo eligen."},"term":"4 years","src":"https://admin.cdn.sos.ca.gov/ca-roster/2026/constitutional-officers.pdf","src_title":"California Roster 2026: Constitutional Officers (California Secretary of State)"},"superintendent_public_instruction":{"title":{"en":"State Superintendent of Public Instruction","es":"Superintendente Estatal de Instrucción Pública"},"desc":{"en":"The State Superintendent of Public Instruction is the only nonpartisan statewide constitutional officer. The Superintendent heads the California Department of Education, administers and enforces state education laws, and serves as executive officer of the State Board of Education. Voters statewide elect the Superintendent.","es":"El Superintendente Estatal de Instrucción Pública es el único funcionario constitucional estatal sin afiliación partidista. Dirige el Departamento de Educación de California, administra y hace cumplir las leyes estatales de educación y es el funcionario ejecutivo de la Junta Estatal de Educación. Los votantes de todo el estado lo eligen."},"term":"4 years","src":"https://admin.cdn.sos.ca.gov/ca-roster/2026/constitutional-officers.pdf","src_title":"California Roster 2026: Constitutional Officers (California Secretary of State)"},"board_of_equalization":{"title":{"en":"State Board of Equalization Member","es":"Miembro de la Junta Estatal de Igualación"},"desc":{"en":"The Board of Equalization has five members: four elected from regional districts across the state, plus the State Controller. The Board oversees how county assessors value property for tax purposes, administers the alcohol and insurer taxes, and hears certain tax appeals. Voters in each district elect its member.","es":"La Junta Estatal de Igualación tiene cinco miembros: cuatro elegidos en distritos regionales de todo el estado, más el Contralor del Estado. La Junta supervisa cómo los asesores del condado valoran las propiedades para fines de impuestos, administra los impuestos sobre bebidas alcohólicas y sobre aseguradoras, y atiende ciertas apelaciones de impuestos. Los votantes de cada distrito eligen a su miembro."},"term":"4 years","src":"https://www.boe.ca.gov/info/about.htm","src_title":"About BOE (California State Board of Equalization)"},"us_house":{"title":{"en":"U.S. Representative (Congress)","es":"Representante de EE. UU. (Congreso)"},"desc":{"en":"The U.S. House of Representatives is one of the two chambers of Congress. Representatives write and pass federal laws, introduce bills, and serve on committees. Each Representative serves a specific congressional district and is elected by its voters every two years.","es":"La Cámara de Representantes de EE. UU. es una de las dos cámaras del Congreso. Los representantes elaboran y aprueban leyes federales, presentan proyectos de ley y trabajan en comités. Cada representante sirve a un distrito congresional específico y es elegido por sus votantes cada dos años."},"term":"2 years","src":"https://www.house.gov/the-house-explained","src_title":"The House Explained (U.S. House of Representatives)"},"state_senate":{"title":{"en":"State Senator","es":"Senador Estatal"},"desc":{"en":"The California State Senate is one of the two houses of the Legislature, which makes state laws. The Senate has 40 members, each elected from a district. Terms are four years, and half of the seats are up for election every two years.","es":"El Senado del Estado de California es una de las dos cámaras de la Legislatura, que elabora las leyes estatales. El Senado tiene 40 miembros, cada uno elegido por un distrito. Los períodos son de cuatro años y la mitad de los escaños se somete a elección cada dos años."},"term":"4 years","src":"https://capitolmuseum.ca.gov/engage/about-the-government/branches-of-government/","src_title":"Branches of Government (California State Capitol Museum)"},"assembly":{"title":{"en":"State Assembly Member","es":"Miembro de la Asamblea Estatal"},"desc":{"en":"The California State Assembly is one of the two houses of the Legislature, which makes state laws. The Assembly has 80 members, each elected from a district. Members serve two-year terms, so all 80 seats are on the ballot every two years.","es":"La Asamblea del Estado de California es una de las dos cámaras de la Legislatura, que elabora las leyes estatales. La Asamblea tiene 80 miembros, cada uno elegido por un distrito. Los miembros cumplen períodos de dos años, por lo que los 80 escaños se someten a elección cada dos años."},"term":"2 years","src":"https://capitolmuseum.ca.gov/engage/about-the-government/branches-of-government/","src_title":"Branches of Government (California State Capitol Museum)"},"supreme_court_retention":{"title":{"en":"California Supreme Court Justice (Retention)","es":"Juez de la Corte Suprema de California (Retención)"},"desc":{"en":"You do not choose between candidates for this office. Instead, you vote Yes or No on whether a Supreme Court justice should stay in office. Justices are nominated by the Governor, confirmed by a commission, and serve 12-year terms. The office is nonpartisan, and all California voters vote on these justices.","es":"No se elige entre candidatos para este cargo. En cambio, se vota Sí o No sobre si un juez de la Corte Suprema debe continuar en su cargo. Los jueces son propuestos por el Gobernador, confirmados por una comisión y cumplen períodos de 12 años. El cargo no es partidista y todos los votantes de California votan sobre estos jueces."},"term":"12 years","src":"https://vig.cdn.sos.ca.gov/2026/general/pdf/justices.pdf","src_title":"Justices of the Supreme Court: The Electoral Procedure (Official Voter Information Guide, Nov. 3, 2026, California Secretary of State)"},"appeals_court_retention":{"title":{"en":"Court of Appeal Justice (Retention)","es":"Juez de la Corte de Apelaciones (Retención)"},"desc":{"en":"You do not choose between candidates for this office. Instead, voters in the court's district vote Yes or No on whether an appeals court justice should stay in office. If a majority votes Yes, the justice serves another term. Justices serve 12-year terms, and the office is nonpartisan.","es":"No se elige entre candidatos para este cargo. En cambio, los votantes del distrito de la corte votan Sí o No sobre si un juez de la Corte de Apelaciones debe continuar en su cargo. Si la mayoría vota Sí, el juez cumple otro período. Los jueces cumplen períodos de 12 años y el cargo no es partidista."},"term":"12 years","src":"https://appellate.courts.ca.gov/about-courts/appellate-retention-elections","src_title":"Appellate Retention Elections (California Courts of Appeal)"},"county_supervisor":{"title":{"en":"County Supervisor","es":"Supervisor del Condado"},"desc":{"en":"The Board of Supervisors is a county's main governing body. Its five members adopt county laws and the county budget and oversee county departments. Each supervisor is elected by the voters of one district and serves a four-year term.","es":"La Junta de Supervisores es el principal órgano de gobierno de un condado. Sus cinco miembros aprueban las ordenanzas y el presupuesto del condado y supervisan los departamentos del condado. Cada supervisor es elegido por los votantes de un distrito y cumple un período de cuatro años."},"term":"4 years","src":"https://www.counties.org/counties/role-of-counties/","src_title":"Role of Counties (California State Association of Counties)"},"county_assessor":{"title":{"en":"County Assessor","es":"Asesor del Condado"},"desc":{"en":"The County Assessor decides the value of property in the county for property tax purposes. The Assessor keeps the yearly assessment roll, values new construction and ownership changes, and handles assessment appeals. A separate office, the Tax Collector, bills and collects the tax. Voters countywide elect the Assessor.","es":"El Asesor del Condado determina el valor de las propiedades del condado para fines del impuesto a la propiedad. Mantiene el padrón anual de valoración, valora las construcciones nuevas y los cambios de propietario, y atiende las apelaciones de valoración. Otra oficina, el Recaudador de Impuestos, emite y cobra el impuesto. Los votantes de todo el condado eligen al Asesor."},"term":"4 years (current cycle varies by county)","src":"https://www.counties.org/counties/role-of-counties/","src_title":"Role of Counties (California State Association of Counties)"},"county_auditor_controller":{"title":{"en":"County Auditor-Controller","es":"Auditor-Contralor del Condado"},"desc":{"en":"The Auditor-Controller is the county's chief accounting officer. The office controls the county budget, issues payments and payroll, prepares financial reports, oversees audits, and calculates and distributes property tax revenue to local agencies. Voters countywide elect this office in most counties.","es":"El Auditor-Contralor es el principal funcionario de contabilidad del condado. La oficina controla el presupuesto del condado, emite pagos y nóminas, prepara informes financieros, supervisa auditorías y calcula y distribuye los ingresos del impuesto a la propiedad a las agencias locales. En la mayoría de los condados, los votantes de todo el condado eligen este cargo."},"term":"4 years (current cycle varies by county)","src":"https://www.counties.org/counties/role-of-counties/","src_title":"Role of Counties (California State Association of Counties)"},"county_clerk_recorder":{"title":{"en":"County Clerk-Recorder","es":"Secretario-Registrador del Condado"},"desc":{"en":"The County Clerk issues marriage licenses and files public documents such as fictitious business name statements. The Recorder keeps land and property records and records of births, deaths, and marriages. Some counties combine these duties with other offices. In most counties, voters countywide elect this office.","es":"El Secretario del Condado expide licencias de matrimonio y archiva documentos públicos, como las declaraciones de nombre comercial ficticio. El Registrador conserva los registros de terrenos y propiedades y los registros de nacimientos, defunciones y matrimonios. Algunos condados combinan estas funciones con otras oficinas. En la mayoría de los condados, los votantes de todo el condado eligen este cargo."},"term":"4 years (current cycle varies by county)","src":"https://www.counties.org/counties/role-of-counties/","src_title":"Role of Counties (California State Association of Counties)"},"district_attorney":{"title":{"en":"District Attorney","es":"Fiscal de Distrito"},"desc":{"en":"The District Attorney is the county's elected public prosecutor. The office investigates and prosecutes crimes under state law and county ordinances, advises the grand jury, and enforces child support. The Board of Supervisors sets the office's budget but does not direct its prosecutions. Voters countywide elect the District Attorney.","es":"El Fiscal de Distrito es el fiscal público electo del condado. La oficina investiga y procesa delitos conforme a las leyes estatales y las ordenanzas del condado, asesora al gran jurado y hace cumplir la manutención de menores. La Junta de Supervisores fija el presupuesto de la oficina, pero no dirige sus procesos penales. Los votantes de todo el condado eligen al Fiscal de Distrito."},"term":"4 years (current terms elected in 2022 run 6 years)","src":"https://www.counties.org/counties/role-of-counties/","src_title":"Role of Counties (California State Association of Counties)"},"sheriff":{"title":{"en":"Sheriff","es":"Alguacil (Sheriff)"},"desc":{"en":"The Sheriff is the county's elected law enforcement officer. The Sheriff's office provides patrol and investigation, runs the county jails, and provides court services. In many counties, including Alameda and San Joaquin, the Sheriff also serves as coroner. Voters countywide elect the Sheriff.","es":"El Sheriff es el funcionario electo de aplicación de la ley del condado. La oficina del Sheriff realiza patrullaje e investigaciones, administra las cárceles del condado y presta servicios a los tribunales. En muchos condados, incluidos Alameda y San Joaquín, el Sheriff también actúa como médico forense (coroner). Los votantes de todo el condado eligen al Sheriff."},"term":"4 years (current terms elected in 2022 run 6 years)","src":"https://www.counties.org/counties/role-of-counties/","src_title":"Role of Counties (California State Association of Counties)"},"county_treasurer_tax_collector":{"title":{"en":"County Treasurer-Tax Collector","es":"Tesorero-Recaudador de Impuestos del Condado"},"desc":{"en":"The Treasurer-Tax Collector manages the county's money and collects property taxes. The office bills and collects property taxes for the county, cities, schools, and special districts, invests public funds, and oversees sales of properties with long-unpaid taxes. In most counties, voters countywide elect this office.","es":"El Tesorero-Recaudador de Impuestos administra el dinero del condado y cobra los impuestos a la propiedad. La oficina emite y cobra los impuestos a la propiedad del condado, las ciudades, las escuelas y los distritos especiales, invierte fondos públicos y supervisa las ventas de propiedades con impuestos sin pagar por mucho tiempo. En la mayoría de los condados, los votantes de todo el condado eligen este cargo."},"term":"4 years (current cycle varies by county)","src":"https://www.counties.org/counties/role-of-counties/","src_title":"Role of Counties (California State Association of Counties)"},"county_superintendent_schools":{"title":{"en":"County Superintendent of Schools","es":"Superintendente de Escuelas del Condado"},"desc":{"en":"The County Superintendent of Schools leads the county office of education, which supports and oversees the county's school districts and acts as a link between districts and the state. In most counties, including Alameda and San Joaquin, voters elect the Superintendent.","es":"El Superintendente de Escuelas del Condado dirige la oficina de educación del condado, que apoya y supervisa los distritos escolares del condado y sirve de enlace entre los distritos y el estado. En la mayoría de los condados, incluidos Alameda y San Joaquín, los votantes eligen al Superintendente."},"term":"4 years","src":"https://www.sjcoe.org/about/superintendent","src_title":"Superintendent (San Joaquin County Office of Education)"},"county_board_of_education":{"title":{"en":"County Board of Education Member","es":"Miembro de la Junta de Educación del Condado"},"desc":{"en":"The County Board of Education is the elected governing body of the county office of education. It sets policy, approves the budget, hears appeals on student expulsions and transfers between districts, and reviews charter school petitions. Members are elected by trustee area. Terms: four years in Alameda County, six in San Joaquin County.","es":"La Junta de Educación del Condado es el órgano de gobierno electo de la oficina de educación del condado. Establece políticas, aprueba el presupuesto, atiende apelaciones sobre expulsiones de estudiantes y traslados entre distritos, y revisa las peticiones de escuelas chárter. Los miembros se eligen por área de fideicomisarios. Períodos: cuatro años en el condado de Alameda y seis en el de San Joaquín."},"term":"4 years (Alameda County) or 6 years (San Joaquin County)","src":"https://www.sjcoe.org/boe","src_title":"Board of Education (San Joaquin County Office of Education)"},"mayor":{"title":{"en":"Mayor","es":"Alcalde"},"desc":{"en":"The mayor is a city's chief elected official. The mayor provides policy leadership to the city council and represents it in public meetings. In some cities voters elect the mayor directly; in others, the council chooses the mayor from among its own members.","es":"El alcalde es el principal funcionario electo de una ciudad. Ofrece liderazgo en políticas al concejo municipal y lo representa en las reuniones públicas. En algunas ciudades los votantes eligen directamente al alcalde; en otras, el concejo elige al alcalde entre sus propios miembros."},"term":"2 or 4 years if elected by voters (varies by city)","src":"https://www.calcities.org/docs/default-source/new-mayors-and-council-members-academy-session-materials/11.-understanding-city's-departments.pdf?sfvrsn=8e709311_3","src_title":"Understanding Your City's Departments, Mayors and Council Members Resource Guide (League of California Cities)"},"city_council":{"title":{"en":"City Council Member","es":"Miembro del Concejo Municipal"},"desc":{"en":"The city council is a city's governing body. Council members are elected by city voters to make local laws, set policy, and approve the city budget. A city manager hired by the council usually runs daily operations. Voters elect members citywide or by district, depending on the city.","es":"El concejo municipal es el órgano de gobierno de una ciudad. Los votantes de la ciudad eligen a sus miembros para elaborar leyes locales, fijar políticas y aprobar el presupuesto municipal. Un administrador municipal contratado por el concejo suele dirigir las operaciones diarias. Los votantes eligen a los miembros en toda la ciudad o por distrito, según la ciudad."},"term":"4 years (typical)","src":"https://www.calcities.org/docs/default-source/new-mayors-and-council-members-academy-session-materials/11.-understanding-city's-departments.pdf?sfvrsn=8e709311_3","src_title":"Understanding Your City's Departments, Mayors and Council Members Resource Guide (League of California Cities)"},"city_attorney":{"title":{"en":"City Attorney","es":"Abogado Municipal"},"desc":{"en":"The city attorney is the city's lawyer. The office advises the council and staff, drafts and reviews ordinances and contracts, and represents the city in court. Many city attorneys are hired by the council, as staff or by contract. In a few cities, such as Oakland, voters elect the city attorney.","es":"El abogado municipal es el abogado de la ciudad. La oficina asesora al concejo y al personal, redacta y revisa ordenanzas y contratos, y representa a la ciudad ante los tribunales. Muchos abogados municipales son contratados por el concejo, como empleados o por contrato. En unas pocas ciudades, como Oakland, los votantes eligen al abogado municipal."},"term":"Varies by city; 4 years where elected","src":"https://www.calcities.org/docs/default-source/new-mayors-and-council-members-academy-session-materials/11.-understanding-city's-departments.pdf?sfvrsn=8e709311_3","src_title":"Understanding Your City's Departments, Mayors and Council Members Resource Guide (League of California Cities)"},"city_auditor":{"title":{"en":"City Auditor","es":"Auditor Municipal"},"desc":{"en":"A city auditor checks how a city spends money and runs its programs. The office does independent audits and investigations and reports the results publicly. Only some cities elect an auditor, including Oakland, Berkeley, and Alameda. An elected auditor is independent of the mayor, council, and city staff.","es":"Un auditor municipal revisa cómo gasta el dinero una ciudad y cómo administra sus programas. La oficina realiza auditorías e investigaciones independientes y publica los resultados. Solo algunas ciudades eligen a un auditor, entre ellas Oakland, Berkeley y Alameda. Un auditor electo es independiente del alcalde, del concejo y del personal de la ciudad."},"term":"4 years where elected","src":"https://www.oaklandauditor.com/about/our-purpose/","src_title":"Our Purpose: Responsibility, Authority and Standards (Office of the City Auditor, City of Oakland)"},"city_clerk":{"title":{"en":"City Clerk","es":"Secretario Municipal"},"desc":{"en":"The city clerk is the city's official record keeper and local elections official. The clerk keeps council records and ordinances, handles public records requests, and oversees city elections and candidate filings. Depending on the city, voters elect the clerk, or the city council or city manager appoints the clerk.","es":"El secretario municipal es el encargado oficial de los registros de la ciudad y el funcionario electoral local. Mantiene los registros y ordenanzas del concejo, atiende las solicitudes de registros públicos y supervisa las elecciones municipales y la presentación de candidaturas. Según la ciudad, los votantes eligen al secretario, o bien lo nombra el concejo municipal o el administrador municipal."},"term":"Varies by city; 4 years where elected","src":"https://www.calcities.org/docs/default-source/new-mayors-and-council-members-academy-session-materials/11.-understanding-city's-departments.pdf?sfvrsn=8e709311_3","src_title":"Understanding Your City's Departments, Mayors and Council Members Resource Guide (League of California Cities)"},"city_treasurer":{"title":{"en":"City Treasurer","es":"Tesorero Municipal"},"desc":{"en":"The city treasurer safeguards the city's money. State law has the treasurer keep all money received, follow the rules for depositing and protecting public funds, pay out money only on proper warrants, and send monthly reports to the city clerk and council. Depending on the city, voters elect the treasurer or the council appoints one.","es":"El tesorero municipal resguarda el dinero de la ciudad. La ley estatal dispone que el tesorero conserve todo el dinero que recibe, cumpla las reglas para depositar y proteger fondos públicos, pague solo con órdenes de pago válidas y envíe informes mensuales al secretario y al concejo. Según la ciudad, los votantes eligen al tesorero o el concejo nombra a uno."},"term":"Varies by city; 4 years where elected","src":"https://leginfo.legislature.ca.gov/faces/codes_displayText.xhtml?lawCode=GOV&division=3.&title=4.&part=3.&chapter=3.&article=","src_title":"California Government Code, Title 4, Division 3, Part 3, Chapter 3: City Treasurer (Sections 41001-41007)"},"school_board":{"title":{"en":"School Board Member (Trustee)","es":"Miembro de la Junta Escolar (Fideicomisario)"},"desc":{"en":"A school district is led by an elected board that appoints a superintendent. The board can change district policies and can modify the superintendent's contract or remove the superintendent. The superintendent runs daily operations and carries out the board's policies. Voters hold the board accountable. Terms are four years, staggered.","es":"Un distrito escolar está dirigido por una junta electa que nombra a un superintendente. La junta puede cambiar las políticas del distrito y puede modificar el contrato del superintendente o destituirlo. El superintendente dirige las operaciones diarias y aplica las políticas de la junta. Los votantes responsabilizan a la junta. Los períodos son de cuatro años y escalonados."},"term":"4 years","src":"https://lao.ca.gov/Publications/Report/5165","src_title":"The 2026-27 Budget: Re-Envisioning State Education Governance (Legislative Analyst's Office)"},"community_college_trustee":{"title":{"en":"Community College Trustee","es":"Fideicomisario de Colegio Comunitario"},"desc":{"en":"A community college district is governed by an elected board of trustees. Trustees are locally elected officials who govern the district, adapt its mission to community needs, and work to keep the colleges strong and financially sound. Many districts, including San Joaquin Delta and Peralta, elect trustees by area. Terms are four years.","es":"Un distrito de colegios comunitarios es gobernado por una junta electa de fideicomisarios. Los fideicomisarios son funcionarios electos localmente que gobiernan el distrito, adaptan su misión a las necesidades de la comunidad y procuran mantener los colegios sólidos y financieramente estables. Muchos distritos, incluidos San Joaquin Delta y Peralta, eligen a los fideicomisarios por área. Los períodos son de cuatro años."},"term":"4 years","src":"https://www.ccleague.org/trustees/","src_title":"Trustees (Community College League of California)"},"special_district_director":{"title":{"en":"Special District Director","es":"Director de Distrito Especial"},"desc":{"en":"Special districts are local governments that provide a specific service, such as water, fire protection, parks, healthcare, or sanitation, within set boundaries. Most are overseen by a board of directors elected by the people the district serves. In some cases a city council or county board appoints the directors. Terms are usually four years.","es":"Los distritos especiales son gobiernos locales que prestan un servicio específico, como agua, protección contra incendios, parques, atención médica o saneamiento, dentro de límites definidos. La mayoría está supervisada por una junta de directores elegida por las personas a quienes sirve el distrito. En algunos casos, un concejo municipal o una junta del condado nombra a los directores. Los períodos suelen ser de cuatro años."},"term":"4 years (typical)","src":"https://www.csda.net/about-special-districts/learn-about","src_title":"Learn About Districts (California Special Districts Association)"},"bart_director":{"title":{"en":"BART Director","es":"Director de BART"},"desc":{"en":"The BART Board of Directors is the policymaking board for Bay Area Rapid Transit. Its nine directors are each elected by voters in one of nine districts across Alameda, Contra Costa, and San Francisco counties. Directors serve four-year terms, with about half of the seats on the ballot every two years.","es":"La Junta Directiva de BART es la junta que fija las políticas de Bay Area Rapid Transit. Cada uno de sus nueve directores es elegido por los votantes de uno de nueve distritos en los condados de Alameda, Contra Costa y San Francisco. Los directores cumplen períodos de cuatro años y cerca de la mitad de los escaños se somete a elección cada dos años."},"term":"4 years","src":"https://www.bart.gov/about/bod","src_title":"Board of Directors (Bay Area Rapid Transit)"},"ac_transit_director":{"title":{"en":"AC Transit Director","es":"Director de AC Transit"},"desc":{"en":"The AC Transit Board of Directors sets policy for the Alameda-Contra Costa Transit District bus system. Its seven directors serve four-year terms. The district is moving from five wards plus two at-large seats to seven wards, with the change complete after the November 2026 election.","es":"La Junta Directiva de AC Transit fija las políticas del sistema de autobuses del Distrito de Tránsito Alameda-Contra Costa. Sus siete directores cumplen períodos de cuatro años. El distrito está pasando de cinco zonas más dos escaños generales a siete zonas, y el cambio quedará completo después de la elección de noviembre de 2026."},"term":"4 years","src":"https://www.actransit.org/candidate-information","src_title":"Candidate Information, 2026 Board of Directors Election (AC Transit)"},"east_bay_mud_director":{"title":{"en":"EBMUD Director","es":"Director de EBMUD"},"desc":{"en":"The EBMUD Board of Directors governs the East Bay Municipal Utility District, which supplies water and treats wastewater in parts of Alameda and Contra Costa counties. Its seven directors are each elected by voters in one ward and set the district's policies. They serve staggered four-year terms.","es":"La Junta Directiva de EBMUD gobierna el Distrito Municipal de Servicios Públicos del Este de la Bahía, que suministra agua y trata aguas residuales en partes de los condados de Alameda y Contra Costa. Cada uno de sus siete directores es elegido por los votantes de una zona y fija las políticas del distrito. Cumplen períodos escalonados de cuatro años."},"term":"4 years","src":"https://www.ebmud.com/about-us/board-directors/board-elections","src_title":"Board Elections (East Bay Municipal Utility District)"},"east_bay_regional_park_director":{"title":{"en":"East Bay Regional Park District Director","es":"Director del Distrito de Parques Regionales del Este de la Bahía"},"desc":{"en":"The East Bay Regional Park District is governed by a seven-member Board of Directors. Each director represents a ward and is elected by voters in that ward. The district covers all of Alameda and Contra Costa counties. Directors serve four-year terms, with three or four seats on the ballot every two years.","es":"El Distrito de Parques Regionales del Este de la Bahía es gobernado por una Junta Directiva de siete miembros. Cada director representa una zona y es elegido por los votantes de esa zona. El distrito abarca todos los condados de Alameda y Contra Costa. Los directores cumplen períodos de cuatro años, con tres o cuatro escaños en la boleta cada dos años."},"term":"4 years","src":"https://www.ebparks.org/board-and-staff/board","src_title":"Board of Directors (East Bay Regional Park District)"},"superior_court_judge":{"title":{"en":"Superior Court Judge","es":"Juez del Tribunal Superior"},"desc":{"en":"Superior Court judges hear the county’s trials: criminal, civil, family, probate and juvenile cases. They are elected county-wide to six-year terms. When no one files to run against an incumbent judge, the office does not appear on the ballot and the incumbent is declared elected (Elections Code §8203).","es":"Los jueces del Tribunal Superior conocen los juicios del condado: casos penales, civiles, familiares, sucesorios y de menores. Se eligen a nivel de condado por mandatos de seis años. Cuando nadie se postula contra un juez titular, el cargo no aparece en la boleta y el titular se declara electo (Código Electoral §8203)."},"term":"6 years","src":"https://www.courts.ca.gov/superiorcourts.htm","src_title":"Judicial Council of California — Superior Courts"}},"concepts":{"ranked_choice_voting":{"title":{"en":"Ranked-Choice Voting","es":"Votación por orden de preferencia"},"desc":{"en":"Ranked-choice voting lets you rank up to five candidates for one office. If no one wins a majority of first choices, the last-place candidate is dropped and those votes go to each voter's next choice, until someone has a majority. It is used for most local offices in Albany, Berkeley, Oakland, and San Leandro.","es":"La votación por orden de preferencia permite clasificar hasta cinco candidatos para un cargo. Si nadie obtiene la mayoría de las primeras opciones, se elimina al último lugar y esos votos pasan a la siguiente opción de cada votante, hasta que alguien tenga la mayoría. Se usa en la mayoría de los cargos locales de Albany, Berkeley, Oakland y San Leandro."},"src":"https://acvote.alamedacountyca.gov/voting/rcv"},"top_two_primary_to_general":{"title":{"en":"Top-Two Primary","es":"Elección primaria de los dos primeros"},"desc":{"en":"For state and federal offices, all candidates appear on one primary ballot and any voter can vote for any candidate. Only the two with the most votes advance to the November election, whatever their party, even if one wins a majority. That is why only two names appear for these offices in November.","es":"Para los cargos estatales y federales, todos los candidatos aparecen en una sola boleta primaria y cualquier votante puede votar por cualquier candidato. Solo los dos con más votos avanzan a la elección de noviembre, sin importar su partido, aunque uno obtenga la mayoría. Por eso en noviembre solo aparecen dos nombres para estos cargos."},"src":"https://vig.cdn.sos.ca.gov/2026/general/pdf/voter-info.pdf"},"trustee_area_vs_at_large":{"title":{"en":"Trustee Area vs. At-Large Elections","es":"Elección por área de fideicomisarios o a nivel general"},"desc":{"en":"In an at-large election, every voter in the district votes for every open seat. In a by-trustee-area election, the district is split into areas, candidates must live in the area they seek to represent, and only voters who live in that area elect that seat.","es":"En una elección a nivel general (at-large), todos los votantes del distrito votan por todos los escaños disponibles. En una elección por área de fideicomisarios, el distrito se divide en áreas, los candidatos deben vivir en el área que buscan representar y solo los votantes que viven en esa área eligen ese escaño."},"src":"https://www.cccco.edu/wp-content/uploads/2019/05/Legal-Advisory-16-02-Change-in-Local-Election-System-pdf.pdf"},"vote_for_up_to_n":{"title":{"en":"Vote for Up to N","es":"Vote por hasta N"},"desc":{"en":"Some contests have more than one open seat, shown as \"Vote for no more than 2\" (or 3, and so on). You may vote for that many candidates or fewer. If you mark more than allowed, your votes in that contest are not counted, but your other choices on the ballot still count.","es":"Algunas contiendas tienen más de un escaño disponible y dicen, por ejemplo, \"Vote por no más de 2\" (o 3, etc.). Puede votar por esa cantidad de candidatos o por menos. Si marca más de lo permitido, sus votos en esa contienda no se cuentan, pero sus demás selecciones en la boleta sí se cuentan."},"src":"https://www.sos.ca.gov/administration/regulations/current-regulations/elections/ballot-counting"},"nonpartisan_office":{"title":{"en":"Nonpartisan Offices","es":"Cargos no partidistas"},"desc":{"en":"Judicial, school, county, and city offices are nonpartisan. Political parties cannot nominate candidates for them, and candidates cannot list a party preference on the ballot, so you will not see party labels next to these names. Any voter may vote for any candidate.","es":"Los cargos judiciales, escolares, de condado y municipales son no partidistas. Los partidos políticos no pueden nominar candidatos para ellos y los candidatos no pueden indicar una preferencia de partido en la boleta, por lo que no verá etiquetas de partido junto a estos nombres. Cualquier votante puede votar por cualquier candidato."},"src":"https://vig.cdn.sos.ca.gov/2026/general/pdf/voter-info.pdf"},"measure_threshold_majority_vs_two_thirds_vs_55":{"title":{"en":"Local Tax and Bond Vote Thresholds","es":"Umbrales de votos para impuestos y bonos locales"},"desc":{"en":"A general tax from a city or county needs a simple majority (50% plus one). A special tax, one for a specific purpose, needs two-thirds. Bonds paid by property taxes generally need two-thirds, but school facility bonds that meet certain conditions need 55%. The ballot measure text states which threshold applies.","es":"Un impuesto general de una ciudad o condado necesita una mayoría simple (50% más uno). Un impuesto especial, para un fin específico, necesita dos tercios. Los bonos pagados con impuestos a la propiedad generalmente necesitan dos tercios, pero los bonos para instalaciones escolares que cumplen ciertas condiciones necesitan 55%. El texto de la medida en la boleta indica qué umbral aplica."},"src":"https://lao.ca.gov/reports/2014/finance/local-taxes/voter-approval-032014.aspx"},"retention_election":{"title":{"en":"Judicial Retention Election","es":"Elección de retención de jueces"},"desc":{"en":"For California Supreme Court and Court of Appeal justices, there is no opponent. Voters simply vote Yes or No on whether each justice should stay in office for another term. Supreme Court justices are on every voter's ballot; appeals court justices appear only for voters in that court's district.","es":"Para los jueces de la Corte Suprema y de la Corte de Apelaciones de California no hay oponente. Los votantes simplemente votan Sí o No sobre si cada juez debe continuar en su cargo por otro período. Los jueces de la Corte Suprema aparecen en la boleta de todos los votantes; los de la Corte de Apelaciones solo aparecen para los votantes del distrito de esa corte."},"src":"https://appellate.courts.ca.gov/about-courts/appellate-retention-elections"},"vca_vote_center_county_vs_polling_place_county":{"title":{"en":"Vote Centers vs. Polling Places","es":"Centros de votación y lugares de votación"},"desc":{"en":"Under the Voter's Choice Act, vote centers open for in-person voting up to 10 days before Election Day, and you can use any vote center in the county. Alameda County uses vote centers. San Joaquin County uses traditional polling places that are open on Election Day, plus a limited number of early voting locations.","es":"Bajo la Ley de Elección del Votante (Voter's Choice Act), los centros de votación abren para votar en persona hasta 10 días antes del día de la elección y se puede usar cualquier centro del condado. El condado de Alameda usa centros de votación. El condado de San Joaquín usa lugares de votación tradicionales que abren el día de la elección, además de un número limitado de lugares de votación anticipada."},"src":"https://elections.cdn.sos.ca.gov/statewide-elections/2026-general/voting-location-number-method.pdf"}}}</script>

function pinRace(id){ const c=myContests().find(x=>x.id===id); if(c){ const d=c.district?String(parseInt(c.district,10)):''; if(c.type==='us_house'&&d) S.cd='CA'+pad2(d); else if(c.type==='assembly'&&d) S.ad=d; else if(c.type==='state_senate'&&d) S.sd=d; else if(c.type==='county_supervisor'&&d) S.sup=d; else if(c.type==='city') S.city=JE(c.juris).replace(/^(City|Town) of /,''); else if(c.type==='school'&&schoolOpts().usd.some(n=>schoolMatch(JE(c.juris),n))) S.usd=schoolOpts().usd.find(n=>schoolMatch(JE(c.juris),n)); else S.pinned[id]=true; } else S.pinned[id]=true; save(); render(); }

// Some states print a whole paragraph as the official measure title. Keep headings readable;

function shortT(s, n){ s=String(s||'');

const socialLinks = c => { const s=c.social||{}; const items=[['site',c.site,t('cand_site')],['x',s.x,'X'],['instagram',s.instagram,'Instagram'],['facebook',s.facebook,'Facebook'],['youtube',s.youtube,'YouTube']].filter(i=>i[1]); return items.length?`<div class="links">${items.map(i=>`<a href="${esc(i[1])}" target="_blank" rel="noopener">${i[2]} ↗</a>`).join('')}</div>`:''; };
const followBtn = (id,name) => `<button class="follow ${S.following[id]?'on':''}" onclick="toggleFollow('${esc(id)}',${JSON.stringify(name).replace(/"/g,'&quot;')});event.stopPropagation()">${S.following[id]?t('unfollow'):t('follow')}</button>`;
function toggleFollow(id,name){ if(S.following[id]) delete S.following[id]; else S.following[id]={name,at:Date.now()}; save(); render(); }

function go(screen,params){ S.screen=screen; S.params=params||{}; save(); render(); const v=document.getElementById('view'); v.scrollTop=0; v.classList.remove('enter'); void v.offsetWidth; v.classList.add('enter'); }
let botOpen=false;
function openSheet(html){ botOpen=false; const s=document.getElementById('sheet'), bg=document.getElementById('sheetbg'); clearTimeout(s._t); s.classList.remove('hide'); bg.classList.remove('hide'); s.innerHTML=html; s.classList.add('show'); bg.classList.add('show'); }
function closeSheet(){ botOpen=false; const s=document.getElementById('sheet'), bg=document.getElementById('sheetbg'); if(!s.classList.contains('show')) return;
  const ms=matchMedia('(prefers-reduced-motion: reduce)').matches?0:240; s.classList.add('hide'); bg.classList.add('hide'); clearTimeout(s._t);
  s._t=setTimeout(()=>{ s.classList.remove('show','hide'); bg.classList.remove('show','hide'); },ms); }
function openBot(){ openSheet(botSheet()); botOpen=true; scrollChat(); }
function scrollChat(){ const c=document.getElementById('chat'); if(c&&c.lastElementChild) c.lastElementChild.scrollIntoView({block:'end'}); }
function showSources(){ const es=S.lang==='es'; const src=D.sources||{}; openSheet(`<h2>${t('src_t')}</h2><ul>
  <li><b>${es?'Candidatos':'Candidates'}:</b> ${es?'listas certificadas de cada Secretario de Estado; para la Cámara en cualquier distrito, la base de datos pública de la FEC (solo nombres y partido).':'each state’s certified candidate list; for U.S. House in any district, the FEC’s public database (names and party only). A “Candidate website” link appears only when an official list printed it or we verified it; otherwise we say so.'}</li>
  <li><b>${es?'Contiendas locales (San Joaquin y Alameda)':'Local races (San Joaquin and Alameda counties)'}:</b> ${es?'listas oficiales de candidatos y medidas de cada Registro de Votantes del condado; descripciones de cargos de fuentes oficiales, enlazadas en cada contienda.':'each county Registrar of Voters’ official candidate and measure lists; office descriptions from official sources, linked on every race.'}</li>
  <li><b>${es?'Posturas':'Positions'}:</b> ${es?'el sitio web de cada candidato o su declaración oficial. Sin caracterización añadida.':'each candidate’s own website or official candidate statement. No characterization added.'}</li>
  <li><b>${es?'Medidas':'Measures'}:</b> ${es?'guías oficiales del votante y secretarías de estado; Ballotpedia donde la guía aún no se publica.':'official voter guides and secretaries of state; Ballotpedia where the official guide isn’t out yet.'}</li>
  <li><b>${es?'Distritos':'Districts'}:</b> ${esc(src.zip_cd||(es?'tabla código postal → distrito del Censo de EE. UU.':'U.S. Census ZIP-to-district relationship file'))}</li>
  <li><b>${es?'Votos de funcionarios':'Officials’ votes'}:</b> ${es?'registros oficiales de votación (clerk.house.gov, leginfo.legislature.ca.gov).':'official roll-call records (clerk.house.gov, leginfo.legislature.ca.gov).'}</li></ul>
  <p class="sub">${t('updated')} ${esc(D.generated||'')}.</p><button class="btn center" onclick="closeSheet()">${t('src_close')}</button>`); }

function registration(){ try{ const r=JSON.parse(localStorage.getItem('bb-registration')||'null'); return r&&r.firstName?r:null; }catch(e){ return null; } }
function startApp(){ if(S.setup) return go('home'); if(registration()) return go('setup',{next:'home'}); location.href='register.html'; }

 candidate(){ const hit=findCandidate(S.params.id); const from=S.params.from==='directory'?'directory':'candidates'; if(!hit) return `${back(from)}<div class="card note">—</div>`; const {r,c}=hit;

   <div class="row" style="margin-bottom:10px"><div class="avatar ${c.cls||''}" style="width:60px;height:60px;font-size:1.3rem">${initials(c.name)}</div><div style="flex:1"><h2 style="margin:0">${esc(c.name)}</h2><div class="sub" style="margin:0">${esc(L(r.office))} · ${partyOf(c)}${c.inc?' · '+(c.inc==='Incumbent'?t('incumbent'):esc(c.inc)):''}</div>${where.length?`<div class="sub" style="margin:0;font-size:.78rem">${where.map(esc).join(' · ')}</div>`:''}</div>${followBtn(id,c.name)}</div>

 lmeasure(){ const lm=myLocalMeasures(); const m=lm[S.params.i||0]; if(!m) return back('measures'); return `

 measure(){ const m=myMeasures()[S.params.i||0]; if(!m) return back('measures'); const plain=LA(m.plain); const pts=S.reading==='simple'?plain:[m.ballot_label||m.legal||'', (S.lang==='es'?'Impacto fiscal: ':'Fiscal impact: ')+L(m.fiscal||m.cost||'—')];

 learn(){ const st=(S.state||'').toLowerCase(); const C=myCounty(); const local=C?[...(C.registrar&&C.registrar.url?[{name:{en:C.registrar.name||(C.name+' County Registrar of Voters'),es:'Registro de votantes del condado de '+C.name},url:C.registrar.url}]:[]),...(C.lookup||[]),...(C.official||[]).filter(l=>!C.registrar||l.url!==C.registrar.url)]:((D.official&&D.official[S.zip])||[]); const stateLinks=(D.official&&D.official[S.state])||[];
   const reads=[{t:{en:'What’s on a ballot?',es:'¿Qué hay en una boleta?'},b:{en:'A ballot has two kinds of choices: people (candidates, from city council to Congress) and measures (yes/no questions that change laws). Local races usually affect your daily life most: rent rules, buses, parks, schools. You don’t have to vote on everything. Leaving a race blank is fine; the rest of your ballot still counts.',es:'Una boleta tiene dos tipos de decisiones: personas (candidatos, desde el concejo hasta el Congreso) y medidas (preguntas de sí/no que cambian leyes). Las contiendas locales suelen afectar más tu vida diaria: renta, autobuses, parques, escuelas. No tienes que votar en todo. Dejar una contienda en blanco está bien; el resto de tu boleta cuenta.'}},
     {t:{en:'How to vote, step by step',es:'Cómo votar, paso a paso'},b:{en:'1. Check you’re registered at your current address. 2. Not registered? Register before your state’s deadline; many states let you register and vote in person through Election Day. 3. Pick how you’ll vote: by mail, early in person, or on Election Day. 4. Voting by mail? Sign the envelope the way you signed your registration, and send it early.',es:'1. Verifica que estás registrado en tu dirección actual. 2. ¿No registrado? Regístrate antes de la fecha límite de tu estado; muchos estados permiten registrarse y votar en persona hasta el día de la elección. 3. Elige cómo votar: por correo, anticipado o el día de la elección. 4. ¿Por correo? Firma el sobre igual que en tu registro y envíalo temprano.'}},
     {t:{en:'How to spot biased election info',es:'Cómo detectar información sesgada'},b:{en:'Ask three questions. Who paid for this? (Campaign ads must say.) Is it a fact or a prediction? (“Will raise taxes” is a claim; the measure’s text is the fact.) Can I find the original? Official voter guides, county election sites, and a measure’s full text are primary sources. Screenshots and group chats are not.',es:'Haz tres preguntas. ¿Quién pagó esto? (Los anuncios deben decirlo.) ¿Es un hecho o una predicción? (“Subirá los impuestos” es una afirmación; el texto de la medida es el hecho.) ¿Puedo encontrar el original? Las guías oficiales, los sitios electorales del condado y el texto completo son fuentes primarias. Las capturas y los chats no.'}}];
   return `

   ${(()=>{ const C=myCounty(); const cs=myContests(); const want=['top_two_primary_to_general','nonpartisan_office','vote_for_up_to_n','retention_election']; if(C&&C.vca===true) want.push('vca_vote_center_county_vs_polling_place_county'); if(cs.some(c=>c.rcv)) want.push('ranked_choice_voting'); if(cs.some(c=>/trustee|area/i.test(JE(c.office)))) want.push('trustee_area_vs_at_large'); if(myLocalMeasures().length) want.push('measure_threshold_majority_vs_two_thirds_vs_55'); const items=want.map(k=>(D.concepts||{})[k]).filter(Boolean); return items.length?`<div class="eyebrow">${S.lang==='es'?'Cómo funciona tu boleta':'How your ballot works'}</div>${items.map(c=>`<details class="card" style="cursor:pointer"><summary style="font-family:var(--display);font-weight:700;font-size:1rem;list-style:none">${esc(L(c.title))}</summary><p style="margin-top:10px;font-size:.95rem">${esc(L(c.desc))}</p>${c.src?`<div>${ext(c.src,t('source'))}</div>`:''}</details>`).join('')}`:''; })()}
   <div class="eyebrow">${t('official_t')}</div><p class="sub">${t('official_s')}</p>
   <div class="card"><div class="links" style="margin:0">
     <a href="https://vote.gov/register/${st}" target="_blank" rel="noopener">vote.gov · ${esc(STATE_NAMES[S.state]||'')} ↗</a>
     ${stateLinks.map(l=>`<a href="${esc(l.url)}" target="_blank" rel="noopener">${esc(L(l.name))} ↗</a>`).join('')}

   </div></div>`; },

 /* ---- Swipe matcher ---- */
 match(){ const pool=swipePool(); if(!S.state) return `<h2>${t('tab_match')}</h2><div class="card note">${t('notloaded')}</div>`;
   if(!pool.length) return `<h2>${t('tab_match')}</h2><div class="card note">${t('sw_none')}</div>`;
   const remaining=pool.filter(p=>!(p.key in S.swipes));
   if(!remaining.length||S.matchDone){ S.matchDone=true; save(); const res=matchResults(); return `
     <div class="row between"><h2>${t('sw_result')}</h2><button class="chip" onclick="S.swipes={};S.matchDone=false;save();go('match')">${t('sw_again')}</button></div><p class="sub">${t('sw_result_s')}</p>
     ${res.map(r=>`<button class="card click" style="width:100%;text-align:left;font:inherit" onclick="go('candidate',{id:'${esc(r.id)}'})"><div class="row between"><h3>${esc(r.name)} <span class="pill" style="margin-left:4px">${esc(r.party)}</span></h3><b style="font-family:var(--display);font-size:1.3rem;color:var(--navy)">${r.pct}%</b></div><div class="bar"><i style="width:${r.pct}%"></i></div><div class="sub" style="margin:0">${esc(L(r.office))} · ${r.agree}/${r.n} ${t('sw_stmts')}</div></button>`).join('')}
     <div class="eyebrow">${t('sw_reveal')}</div>${pool.filter(p=>S.swipes[p.key]===1).map(p=>`<div class="card" style="padding:10px 14px"><div class="sub" style="margin:0 0 4px"><b>${esc(p.name)}</b> · ${issueName(p.topic)}</div><div style="font-size:.92rem">${p.kind==='vote'?`<b>${t(p.yea?'sw_yea':'sw_nay')}</b> · `:''}${esc(L(p.statement))}</div></div>`).join('')||`<div class="card note">—</div>`}`; }
   const cur=remaining[0], nxt=remaining[1]; const done=pool.length-remaining.length;
   return `
   <div class="row between"><h2>${t('tab_match')}</h2><span class="pill navy">${done+1} / ${pool.length}</span></div><p class="sub">${t('sw_intro')}</p>
   <div class="deck">
     ${nxt?`<div class="swipe-card behind${nxt.kind==='vote'?' vote-card':''}">${swipeBody(nxt)}</div>`:''}
     <div class="swipe-card top${cur.kind==='vote'?' vote-card':''}" id="swtop" data-key="${esc(cur.key)}"><span class="stamp yes">${t('sw_agree').toUpperCase()}</span><span class="stamp no">${t('sw_dis').toUpperCase()}</span>${swipeBody(cur)}</div>
   </div>
   <div class="swipe-actions"><button class="btn ghost center" onclick="swipe(-1)">${ICON.x}${t('sw_dis')}</button><button class="btn ghost center small" style="box-shadow:inset 0 0 0 2px var(--line);color:var(--muted)" onclick="swipe(0)">${t('sw_skip')}</button><button class="btn center" style="background:var(--good);box-shadow:0 2px 0 #1F6B41" onclick="swipe(1)">${ICON.check}${t('sw_agree')}</button></div>`; },

 /* ---- Followed official / candidate ---- */
 record(){ const o=REPS.officials.find(x=>x.id===S.params.id); if(!o) return back('updates');

 updates(){ const fol=Object.keys(S.following); const reps=REPS.officials.filter(o=>fol.includes(o.id)); const cands=fol.filter(id=>!REPS.officials.some(o=>o.id===id)).map(id=>({id,f:S.following[id],hit:findCandidate(id)}));

   <div class="eyebrow">${t('upd_all')}</div>
   <div class="feed">${items.map(i=>`<div class="card ${i.hot?'alert':''}"><time>${esc(i.date)}</time><h3 style="margin-top:4px">${esc(L(i.title))}</h3><p style="margin:0;font-size:.92rem;color:var(--ink-2)">${esc(L(i.body))}</p>${ext(i.url,'↗')}</div>`).join('')||`<div class="card note">—</div>`}</div>`; },

 profile(){ const ints=interestSummary(); return `

/* ---------- candidate list + positions ---------- */
function normPos(c){ if(c.positions&&Array.isArray(c.positions)) return c.positions.map(p=>({topic:p.topic||'other',statement:p.statement,url:p.url,kind:p.kind||'stated',date:p.date,context:p.context})); if(c.pos) return Object.entries(c.pos).map(([k,v])=>({topic:k,statement:v,url:c.src})); return []; }
const statusPill = r => { const s=r.status; if(!s||s==='contested') return ''; const k={unopposed:'st_unopposed',appointed_in_lieu:'st_ail',not_on_ballot:'st_nob',no_candidate:'st_nocand',retention:'st_retention',judicial_uncontested:'st_judicial_uncontested'}[s]; return k?`<span class="pill ${s==='unopposed'||s==='retention'?'navy':'muted'}" style="margin-left:6px">${t(k)}</span>`:''; };
function myRaceIds(){ return new Set(myRaces().filter(r=>!r.unresolved).map(r=>r.id)); }
function dirQuery(v){ S.dirQ=v; const el=document.getElementById('dirlist'); if(el) el.innerHTML=dirList(); }
function dirList(){ const q=(S.dirQ||'').trim().toLowerCase(); const mine=myRaceIds(); const cs=myContests().filter(c=>!q||[JE(c.office),L(c.office),JE(c.juris),L(c.juris),...(c.candidates||[]).map(x=>x.name)].join(' ').toLowerCase().includes(q));
  if(!cs.length) return `<div class="card note">${t('dir_none')}</div>`;
  const groups=[]; for(const c of cs){ const k=JE(c.juris); let g=groups.find(x=>x.k===k); if(!g){ g={k,level:L(c.level),label:L(c.juris),items:[]}; groups.push(g); } g.items.push(c); }
  const ORDER=['us_house','statewide','state_senate','assembly','judicial','county_supervisor','county_office','city','school','college','transit','special']; const rank=g=>Math.min(...g.items.map(c=>{const i=ORDER.indexOf(c.type); return i<0?99:i;}));
  groups.sort((a,b)=>rank(a)-rank(b)||a.label.localeCompare(b.label));
  return groups.map(g=>`<div class="eyebrow">${esc(g.level)} · ${esc(g.label)}</div>${g.items.map(c=>`<div class="race"><h3 class="race-t">${esc(L(c.office))}${statusPill(c)}</h3><div class="sub meta">${[c.on_ballot===false?'':L(c.election),c.seats>1?(c.on_ballot===false?`${c.seats} ${t('seats_l')}`:`${t('votefor')} ${c.seats}`):'',c.term?`${t('term_l')} ${termLabel(c.term)}`:'',c.on_ballot===false?t('dir_offballot'):(mine.has(c.id)?t('on_my_ballot'):t('not_my_ballot'))].filter(Boolean).map(esc).join(' · ')}</div>${c.status_note?`<div class="sub" style="margin:0 0 8px">${esc(L(c.status_note))}</div>`:''}${c.candidates&&c.candidates.length?candList(c,'directory'):`<div class="card note">${t('st_nocand')}</div>`}</div>`).join('')}`).join(''); }
function raceCard(r){ const od=r.office_key&&(D.offices||{})[r.office_key]; const meta=[L(r.juris),L(r.election),r.seats>1?`${t('votefor')} ${r.seats}`:'',r.term?`${t('term_l')} ${termLabel(r.term)}`:'',r.rcv?t('rcv'):''].filter(Boolean);
  return `<div class="race"><h3 class="race-t">${esc(L(r.office))}${r.fec?` <span class="pill live" style="margin-left:6px">LIVE · FEC</span>`:''}${statusPill(r)}</h3>
   ${meta.length?`<div class="sub meta">${meta.map(esc).join(' · ')}</div>`:''}${r.note?`<div class="sub" style="margin:0 0 8px">${esc(L(r.note))}</div>`:''}
   ${od?`<details class="odesc"><summary>${t('office_what')}</summary><p>${esc(L(od.desc))}</p>${od.src?`<div>${ext(od.src,t('source'))}</div>`:''}</details>`:''}
   ${r.fec&&redistricted()?`<div class="card warn">${t('redistricted')}</div>`:''}${r.fec?`<div id="fec-${r.id}" class="sub">${t('fec_loading')}</div>`:candList(r)}
   ${r.curated&&r.candidates&&r.candidates.some(c=>normPos(c).some(p=>p.kind==='stated'))?`<button class="btn ghost center small" style="margin:2px 0 10px;width:100%" onclick="go('compare',{race:'${esc(r.id)}'})">${t('compare')}</button>`:''}
   ${r.unresolved?`<div class="chips" style="margin:0 0 12px"><button class="chip" onclick="pinRace('${esc(r.id)}')">✓ ${t('on_ballot')}</button></div>`:''}</div>`; }
function localMeasuresHtml(){ const lm=myLocalMeasures(); if(!lm.length) return ''; const mine=[],other=[]; lm.forEach((m,i)=>(localMeasureMine(m)?mine:other).push([m,i]));
  const card=([m,i])=>`<button class="card click" style="width:100%;text-align:left;font:inherit" onclick="go('lmeasure',{i:${i}})"><h3>${esc((S.lang==='es'?'Medida ':'Measure ')+m.id)}${m.title?` · ${esc(m.title)}`:''}</h3><div class="sub" style="margin:0">${esc(L(m.juris))}${m.threshold?` · ${t('needs')} ${esc(m.threshold)}`:''}</div></button>`;
  return `<div class="eyebrow">${t('local_meas')}</div><p class="sub">${t('local_meas_s')}</p>${mine.length?mine.map(card).join(''):''}${other.length?`<details class="legal-d"><summary>${t('meas_other')} (${other.length})</summary><p class="sub">${t('meas_other_s')}</p>${other.map(card).join('')}</details>`:''}`; }
function candList(r,from){ const cs=r.candidates||[]; if(!cs.length) return `<div class="card note">${t('st_nocand')}</div>`;
  return cs.map(c=>{ const id=candId(r,c); c.id=id; return `<button class="card click row" style="width:100%;text-align:left;font:inherit" onclick="go('candidate',{id:'${esc(id)}',from:'${from||'candidates'}'})"><div class="avatar ${c.cls||''}">${initials(c.name)}</div><div style="flex:1"><h3>${esc(c.name)} <span class="pill" style="margin-left:4px">${partyOf(c)}</span>${c.inc==='Incumbent'?` <span class="pill navy">${t('incumbent')}</span>`:''}</h3><div class="sub" style="margin:0">${!normPos(c).length?(c.fec?'':(c.review==='none_found'?t('none_s'):(c.review==='reviewed'?'':t('unrev_s')))):esc(L(c.summary)||'')}</div></div>${ICON.arrow.replace('<svg','<svg style="width:18px;height:18px;stroke:var(--muted);fill:none;stroke-width:2;flex:none"')}</button>`; }).join(''); }
async function fillFEC(){ for(const r of myRaces()){ if(!r.fec) continue; const el=document.getElementById('fec-'+r.id); if(!el) continue;
  try{ const cs=await loadFEC(S.cd); r.candidates=cs; const race=myRaces().find(x=>x.id===r.id); if(race) race.candidates=cs; D.races.house=D.races.house||{}; D.races.house[S.cd]=D.races.house[S.cd]||{candidates:cs,fec:true};
    el.outerHTML=(cs.length?candList(Object.assign({},r,{candidates:cs})):`<div class="card note">${t('fec_none')}</div>`)+`<div class="card warn">${t('fec_note')}</div>`; }
  catch(e){ el.outerHTML=`<div class="card warn">${t('fec_fail')} ${ext('https://www.fec.gov/data/elections/house/'+S.cd.slice(0,2)+'/'+S.cd.slice(2)+'/2026/','FEC')}</div>`; } } }

/* ---------- swipe logic ---------- */
const slug = s => (s||'').toLowerCase().replace(/[^a-z]/g,'');
const shorten = (s,n) => s.length>n ? s.slice(0,n).replace(/\s+\S*$/,'')+'…' : s;
// Share of the chamber on the winning side; lower = more contested
const voteMargin = v => { const m=/(\d+)-(\d+)/.exec(v.outcome||''); return m ? Math.max(+m[1],+m[2])/(+m[1]+ +m[2]) : 1; };
// A few of an incumbent's most contested recorded votes, so the deck isn't only campaign promises
function recordCards(r,c,id){ const o=REPS.officials.find(x=>slug(x.name)===slug(c.name)); if(!o) return [];
  return (o.votes||[]).filter(v=>/yea|aye|yes|nay|no\b/i.test(v.vote||'')).map((v,i)=>({v,i})).sort((a,b)=>voteMargin(a.v)-voteMargin(b.v)).slice(0,2)
    .map(({v,i})=>({key:id+'#vote'+i,cid:id,name:c.name,party:partyOf(c),office:r.office,topic:'record',kind:'vote',yea:/yea|aye|yes/i.test(v.vote),statement:shorten(`${v.title}: ${v.what_it_does||''}`,150)})); }
function swipeBody(p){ const vote=p.kind==='vote';
  return `<div class="who">${t('sw_says')} ${esc(L(p.office))} ${t(vote?'sw_voted2':'sw_says2')}</div><div class="q">${esc(L(p.statement))}</div>
  <div class="row" style="gap:6px;flex-wrap:wrap">${vote?`<span class="pill ${p.yea?'good':'gold'}">${t(p.yea?'sw_yea':'sw_nay')}</span>`:''}<span class="pill">${issueName(p.topic)}</span></div>`; }
function swipePool(){ const pool=[], votes=[]; for(const r of myRaces()){ if(!r.candidates) continue; for(const c of r.candidates){ const id=candId(r,c); c.id=id; normPos(c).forEach((p,i)=>{ if(p.statement&&(p.kind||'stated')==='stated') pool.push({key:id+'#'+i,cid:id,name:c.name,party:partyOf(c),office:r.office,topic:p.topic,statement:p.statement}); }); votes.push(...recordCards(r,c,id)); } }
  // stable shuffle by key hash so order is consistent per user
  const h=s=>{let x=0;for(const ch of s)x=(x*31+ch.charCodeAt(0))>>>0;return x;}; const byHash=(a,b)=>h(a.key+S.zip)-h(b.key+S.zip);
  // reserve a few slots for recorded votes so they aren't crowded out by promises
  const v=votes.sort(byHash).slice(0,4), deck=pool.sort(byHash).slice(0,24-v.length);
  const gap=Math.max(1,Math.floor(deck.length/(v.length+1))); v.forEach((x,i)=>deck.splice(Math.min(deck.length,gap*(i+1)+i),0,x)); return deck; }
function swipe(v){ const el=document.getElementById('swtop'); if(!el) return; const key=el.dataset.key; S.swipes[key]=v; save();
  el.style.animation='none'; el.style.transform=`translateX(${v>0?120:v<0?-120:0}%) rotate(${v*15}deg)`; el.style.opacity='0'; setTimeout(()=>render(),220); }
function attachSwipe(){ const el=document.getElementById('swtop'); if(!el) return; let x0=null, dx=0;
  const yes=el.querySelector('.stamp.yes'), no=el.querySelector('.stamp.no');
  el.onpointerdown=e=>{ x0=e.clientX; el.setPointerCapture(e.pointerId); el.style.transition='none'; el.style.animation='none'; };
  el.onpointermove=e=>{ if(x0===null) return; dx=e.clientX-x0; el.style.transform=`translateX(${dx}px) rotate(${dx/18}deg)`; yes.style.opacity=Math.min(1,Math.max(0,dx/80)); no.style.opacity=Math.min(1,Math.max(0,-dx/80)); };
  el.onpointerup=el.onpointercancel=e=>{ if(x0===null) return; el.style.transition=''; if(dx>90) swipe(1); else if(dx<-90) swipe(-1); else { el.style.transform=''; yes.style.opacity=0; no.style.opacity=0; } x0=null; dx=0; }; }
function matchResults(){ const pool=swipePool(); const by={}; for(const p of pool){ const v=S.swipes[p.key]; if(v===undefined||v===0) continue; by[p.cid]=by[p.cid]||{id:p.cid,name:p.name,party:p.party,office:p.office,n:0,agree:0}; by[p.cid].n++; if(v===1) by[p.cid].agree++; }
  return Object.values(by).map(r=>Object.assign(r,{pct:Math.round(100*r.agree/r.n)})).sort((a,b)=>b.pct-a.pct||b.n-a.n); }
function interestSummary(){ const pool=swipePool(); const c={}; for(const p of pool){ if(S.swipes[p.key]===1) c[p.topic]=(c[p.topic]||0)+1; } return Object.entries(c).sort((a,b)=>b[1]-a[1]).slice(0,6).map(e=>e[0]); }

/* ---------- actions ---------- */
function chipGroup(label,opts,cur,field,fmtf,v){ return opts.length>1?`<div class="sub" style="margin:8px 0 4px">${label}</div><div class="chips">${opts.map(o=>`<button class="chip ${cur===o?'on':''}" onclick="S.${field}='${esc(o).replace(/'/g,'&#39;')}';save();previewZip('${esc(v)}')">${fmtf(o)}</button>`).join('')}</div>`:''; }
function previewZip(v){ const el=document.getElementById('zipprev'); const pick=document.getElementById('cdpick'); const st=v.length===5?zipToState(v):''; const o=v.length===5?setupOptions(v):{cds:[],cities:[],ads:[],sds:[],usds:[]};
  const bits=[]; if(st){ if(countyFor(v)) bits.push(countyFor(v)); bits.push(STATE_NAMES[st]); if(o.cities.length===1) bits.push(o.cities[0]); else if(o.county&&!o.cities.length&&zipInfo(v)) bits.push(t('unincorp')); if(o.cds.length===1) bits.push(cdLabel(o.cds[0])); if(o.ads.length===1) bits.push('AD-'+o.ads[0]); if(o.sds.length===1) bits.push('SD-'+o.sds[0]); }
  el.textContent=st?bits.join(' · '):(v.length===5?(S.lang==='es'?'Código no reconocido':'ZIP not recognized'):'');
  pick.innerHTML=chipGroup(t('pick_cd'),o.cds,S.cd,'cd',cdLabel,v)+chipGroup(t('pick_city'),o.cities,S.city,'city',x=>esc(x),v)+chipGroup(t('pick_ad'),o.ads,S.ad,'ad',x=>'AD-'+x,v)+chipGroup(t('pick_sd'),o.sds,S.sd,'sd',x=>'SD-'+x,v)+chipGroup(t('pick_usd'),o.usds,S.usd,'usd',x=>esc(x),v); }
/* Apply a ZIP to state: county, and each district type (single option → set; several → keep the user's pick if still valid, else leave for the pick list). `keep` is used on reload so saved picks survive. */
function applyZip(v,keep){ const st=zipToState(v); if(!st) return false; const o=setupOptions(v);
  if(S.zip!==v){ S.cd=''; S.city=''; S.ad=''; S.sd=''; S.sup=''; S.usd=''; S.pinned={}; S.swipes={}; S.matchDone=false; }
  const pick=(cur,opts)=>opts.length===1?opts[0]:(opts.includes(cur)?cur:'');
  S.zip=v; S.state=st; S.county=countyFor(v); S.cd=pick(S.cd,o.cds); S.city=pick(S.city,o.cities); S.ad=pick(S.ad,o.ads); S.sd=pick(S.sd,o.sds); S.usd=pick(S.usd,o.usds);
  if(!o.county&&!S.cd&&o.cds.length) S.cd=o.cds[0];   // outside covered counties keep the old behaviour: largest Census district by default
  S.cdOptions=o.cds; S.cityOptions=o.cities; S.adOptions=o.ads; S.sdOptions=o.sds; S.usdOptions=o.usds; return true; }
function finishSetup(){ const v=document.getElementById('zip').value.trim(); if(!/^\d{5}$/.test(v)||!applyZip(v)){ toast(t('zip_err')); return; }
  S.setup=true; save(); go(S.params.next||'home'); if(countyKey()) loadCounty(countyKey()).then(ok=>{ if(ok){ applyZip(S.zip,true); save(); } render(); }); toast((S.lang==='es'?'Boleta lista: ':'Ballot ready: ')+(S.county?S.county+', ':'')+STATE_NAMES[S.state]); }
function setLang(l){ const z=document.getElementById('zip'); const v=z?z.value:null; S.lang=l; save(); render(); if(v!==null){ const n=document.getElementById('zip'); if(n){ n.value=v; previewZip(v); } } }
function setReminder(id){ S.reminders[id]=!S.reminders[id]; save(); if(S.reminders[id]) askNotify(); render(); toast(S.reminders[id]?t('reminded'):t('unreminded')); }
function askNotify(){ if('Notification' in window && Notification.permission==='default'){ try{ Notification.requestPermission(); }catch(e){} } }
function openFollowed(id){ if(REPS.officials.some(o=>o.id===id)) go('record',{id}); else if(findCandidate(id)) go('candidate',{id}); else go('updates'); }

/* ---------- BallotBot ---------- */
let sampleFn=null, ctl=null;
(async()=>{ try{ if(window.claude&&claude.use) sampleFn=await claude.use('sample'); }catch(e){ sampleFn=null; } })();
function canned(q){ const s=q.toLowerCase(); const es=S.lang==='es'; const ms=myMeasures(); const races=myRaces();
  if(/regist/.test(s)) return es?`Revisa tu registro en ${S.state==='CA'?'voterstatus.sos.ca.gov':'vote.gov'}; toma un minuto. Abre Fechas límite para ver la fecha de tu estado.`:`Check your registration at ${S.state==='CA'?'voterstatus.sos.ca.gov':'vote.gov'}; it takes a minute. Open Deadlines for your state’s date.`;
  if(/\bid\b|identif/.test(s)) return es?'Depende del estado. En California la mayoría no necesita mostrar identificación. Revisa vote.gov para tu estado.':'It depends on your state. In California most registered voters don’t need to show ID. Check vote.gov for your state.';
  if(/measure|prop|medida|propuesta/.test(s)) return ms.length?(es?`Tu boleta tiene ${ms.length} medidas estatales: ${ms.slice(0,4).map(m=>m.number).join(', ')}${ms.length>4?'…':''}. Abre Medidas para cada una en lenguaje sencillo.`:`Your ballot has ${ms.length} statewide measures: ${ms.slice(0,4).map(m=>m.number).join(', ')}${ms.length>4?'…':''}. Open Measures for each one in plain English.`):(es?'No hay medidas estatales en tu boleta este año.':'No statewide measures are on your ballot this year.');
  if(/governor|gobernador|senate|senado|congress|house|who.*running|quién/.test(s)) return races.length?(es?`Tus contiendas: ${races.map(r=>L(r.office)).join('; ')}. Abre Candidatos para las posturas de cada uno, tomadas de sus propios sitios. No te diré por quién votar.`:`Your races: ${races.map(r=>L(r.office)).join('; ')}. Open Candidates for each person’s positions, taken from their own sites. I won’t tell you who to vote for.`):(es?'Aún no tengo contiendas cargadas para tu estado.':'I don’t have races loaded for your state yet.');
  return es?'Buena pregunta. Revisa Medidas, Candidatos y Fechas límite, o el sitio electoral de tu estado.':'Good question. Check Measures, Candidates, and Deadlines, or your state’s election site.'; }
async function askBot(q){ q=(q||'').trim(); if(!q) return; S.chat.push({role:'user',content:q}); save(); render();
  const chat=document.getElementById('chat'); const bubble=document.createElement('div'); bubble.className='msg bot'; bubble.textContent=t('thinking'); chat.appendChild(bubble); bubble.scrollIntoView({block:'end'});
  const btn=document.getElementById('askbtn'); if(btn) btn.disabled=true;
  let text='';
  if(sampleFn){
    const races=myRaces(), ms=myMeasures(), ints=interestSummary(), fol=Object.values(S.following).map(f=>f.name);
    const rules=`You are BallotBot, a strictly nonpartisan voter-education assistant inside the BallotBuddy app for voters 18+. Answer in ${S.lang==='es'?'Spanish':'English'}, in plain language at about an 8th-grade reading level, in at most 3 short sentences. Never tell the user who or what to vote for, never characterize parties, candidates, or measures as good or bad, and never add facts about candidates beyond the data below. If asked for a recommendation, explain how to weigh the choice instead. Tailor answers to this voter: ZIP ${S.zip||'unknown'} (${STATE_NAMES[S.state]||'unknown state'}${S.cd?', '+cdLabel(S.cd):''}). Their swiped interests: ${ints.map(issueName).join(', ')||'none yet'}. They follow: ${fol.join(', ')||'no one yet'}. Election Day: Tuesday, Nov 3, 2026. If a question needs state rules you don't have, point to vote.gov/register/${(S.state||'').toLowerCase()}.\nDEADLINES: ${deadlines().map(d=>L(d.title)+(d.date?' '+d.date.toDateString():'')).join('; ')}\nRACES ON THEIR BALLOT:\n${races.map(r=>`- ${L(r.office)}: ${(r.candidates||[]).map(c=>c.name+' ['+partyOf(c)+']'+(normPos(c).length?': '+normPos(c).map(p=>L(p.statement)).join(' / '):' (no published positions)')).join('; ')||'(loading)'}`).join('\n')}\nSTATEWIDE MEASURES:\n${ms.map(m=>`- ${m.number} ${L(m.title)}: ${(m.ballot_label||'').slice(0,200)} YES: ${L(m.yes)} NO: ${L(m.no)}`).join('\n')}`.slice(0,60000);
    const turns=S.chat.slice(-8);
    ctl=new AbortController();
    try{ const res=await sampleFn([{role:'user',content:rules},{role:'assistant',content:'Understood.'},...turns],{cache:false,modelTier:'quick',signal:ctl.signal,onText:({text:tx})=>{bubble.textContent=tx;}}); text=res.text; }
    catch(e){ text=e&&e.text?e.text:(e&&e.code==='rate_limited'?(S.lang==='es'?'Demasiadas preguntas seguidas. Intenta en un momento.':'Too many questions at once. Try again in a moment.'):canned(q)); }
  } else { await new Promise(r=>setTimeout(r,500)); text=canned(q); }
  S.chat.push({role:'assistant',content:text}); save(); render(); const c2=document.getElementById('chat'); if(c2) c2.lastElementChild.scrollIntoView({block:'end'}); }

/* ---------- render ---------- */
function render(){
  if(speaking){ try{ speechSynthesis.cancel(); }catch(e){} speaking=false; }
  if(S.screen==='bot') S.screen='home';
  const v=document.getElementById('view'); v.classList.toggle('large',S.large); v.classList.toggle('home-view',S.screen==='home');
  v.innerHTML=SCREENS[S.screen]?SCREENS[S.screen]():SCREENS.welcome();
  document.querySelectorAll('[data-i]').forEach(el=>el.textContent=t(el.dataset.i));
  const tabFor={home:'home',candidates:'home',candidate:'home',compare:'home',measures:'home',measure:'home',lmeasure:'home',directory:'home',deadlines:'home',learn:'home',match:'match',updates:'updates',record:'updates',profile:'profile'};
  document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',b.dataset.tab===tabFor[S.screen]));
  const onboarding=S.screen==='welcome'||S.screen==='setup';
  document.getElementById('tabs').style.display=onboarding?'none':'flex';
  document.getElementById('mascot').style.display=onboarding?'none':'flex';
  if(botOpen){ document.getElementById('sheet').innerHTML=botSheet(); scrollChat(); }
  if(S.screen==='setup'){ const z=document.getElementById('zip'); if(z&&z.value) previewZip(z.value); }
  if(S.screen==='candidates') fillFEC();
  if(S.screen==='match') attachSwipe();
}
document.getElementById('mascot').innerHTML=MASCOT_SVG;
function firstScreen(){ return S.setup?'home':(registration()?'setup':'welcome'); }
document.querySelector('[data-tab="home"]').onclick=()=>go(firstScreen());
if(!S.setup){ S.screen=firstScreen(); S.params={}; }
render(); loadAll().then(checkReminders);
</script>
